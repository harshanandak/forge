schema_id: forge.validation.risk-manifest.v1
revision: 1

commands:
  - id: validation.command.affected-platform
    executable: bun
    argv: [test, --timeout, "15000", test/integration]
  - id: validation.command.contract-baseline
    executable: bun
    argv: [test, --timeout, "15000", test/integration]
  - id: validation.command.facade-package
    executable: bun
    argv: [test, --timeout, "15000", test/commands]
  - id: validation.command.flow-package
    executable: bun
    argv: [test, --timeout, "15000", test/workflow]
  - id: validation.command.g0-static
    executable: bun
    argv: [x, eslint, ., --max-warnings, "0"]
  - id: validation.command.g1-manifest-check
    executable: node
    argv: [scripts/generate-risk-manifest.js, --check]
  - id: validation.command.g1-selector
    executable: bun
    argv: [test, --timeout, "15000", test/validation/risk-manifest.test.js, test/validation/risk-manifest-generator.test.js]
  - id: validation.command.g3-contract
    executable: bun
    argv: [test, --timeout, "15000", test/integration]
  - id: validation.command.g4-authority
    executable: bun
    argv: [test, --timeout, "15000", test/kernel]
  - id: validation.command.g5-data
    executable: bun
    argv: [test, --timeout, "15000", test/memory]
  - id: validation.command.g6-platform
    executable: bun
    argv: [test, --timeout, "15000", test/integration]
  - id: validation.command.g7-journey
    executable: bun
    argv: [test, --timeout, "15000", test/e2e]
  - id: validation.command.kernel-package
    executable: bun
    argv: [test, --timeout, "15000", test/kernel]
  - id: validation.command.memory-package
    executable: bun
    argv: [test, --timeout, "15000", test/memory]
  - id: validation.command.repository-baseline
    executable: bun
    argv: [run, test:full:parallel]
  - id: validation.command.validation-selector
    executable: bun
    argv: [test, --timeout, "15000", test/validation/risk-manifest.test.js, test/validation/risk-manifest-generator.test.js]

gates:
  - { id: G0, command_ids: [validation.command.g0-static] }
  - { id: G1, command_ids: [validation.command.g1-manifest-check, validation.command.g1-selector] }
  - { id: G3, command_ids: [validation.command.g3-contract] }
  - { id: G4, command_ids: [validation.command.g4-authority] }
  - { id: G5, command_ids: [validation.command.g5-data] }
  - { id: G6, command_ids: [validation.command.g6-platform] }
  - { id: G7, command_ids: [validation.command.g7-journey] }

lanes:
  - { id: affected-platform-baseline, command_ids: [validation.command.affected-platform] }
  - { id: contract-baseline, command_ids: [validation.command.contract-baseline] }
  - { id: facade-package, command_ids: [validation.command.facade-package] }
  - { id: flow-package, command_ids: [validation.command.flow-package] }
  - { id: kernel-package, command_ids: [validation.command.kernel-package] }
  - { id: memory-package, command_ids: [validation.command.memory-package] }
  - { id: repository-baseline, command_ids: [validation.command.repository-baseline] }
  - { id: validation-selector, command_ids: [validation.command.validation-selector] }

risks:
  - id: authority-integrity
    severity: S0
    non_quarantinable: true
    gate_ids: [G0, G1, G4]
  - id: contract-compatibility
    severity: S1
    non_quarantinable: true
    gate_ids: [G0, G1, G3]
  - id: facade-routing
    severity: S1
    non_quarantinable: false
    gate_ids: [G0, G1, G7]
  - id: memory-data-integrity
    severity: S0
    non_quarantinable: true
    gate_ids: [G0, G1, G5]
  - id: monitor-cleanup
    severity: S1
    non_quarantinable: true
    gate_ids: [G0, G1, G4, G6]
  - id: validation-selection
    severity: S0
    non_quarantinable: true
    gate_ids: [G0, G1]

owners:
  - id: facade-cli
    product: facade
    package: forge-workflow
    package_roots: [bin, lib/commands]
    selectors:
      - { kind: path, prefix: "bin/" }
      - { kind: path, prefix: "lib/commands/" }
      - { kind: command, prefix: "forge " }
    risk_ids: [facade-routing]
    canonical_test_ids: ["test/commands/**/*.test.js"]
    dependent_routes: [installed-cli]
    platform_runtime_additions: [windows-shell]
    lanes: [facade-package]
  - id: kernel-authority
    product: memory
    package: forge-kernel
    package_roots: [lib/kernel]
    selectors:
      - { kind: path, prefix: "lib/kernel/" }
      - { kind: schema, prefix: "forge.kernel." }
    risk_ids: [authority-integrity]
    canonical_test_ids: ["test/kernel/**/*.test.js"]
    dependent_routes: [memory-contract]
    platform_runtime_additions: [windows-sqlite, linux-sqlite]
    lanes: [kernel-package]
  - id: memory-foundation
    product: memory
    package: forge-memory
    package_roots: [lib/memory]
    selectors:
      - { kind: path, prefix: "lib/memory/" }
      - { kind: schema, prefix: "forge.memory." }
    risk_ids: [memory-data-integrity, contract-compatibility]
    canonical_test_ids: ["test/memory/**/*.test.js"]
    dependent_routes: [memory-contract]
    platform_runtime_additions: [windows-sqlite, linux-sqlite]
    lanes: [memory-package]
  - id: validation-control
    product: memory
    package: forge-validation
    package_roots: [lib/validation, validation, scripts/generate-risk-manifest.js]
    selectors:
      - { kind: path, prefix: "lib/validation/" }
      - { kind: path, prefix: "scripts/generate-risk-manifest.js" }
      - { kind: path, prefix: "validation/" }
      - { kind: schema, prefix: "forge.validation." }
    risk_ids: [validation-selection]
    canonical_test_ids: ["test/validation/risk-manifest.test.js", "test/validation/risk-manifest-generator.test.js"]
    dependent_routes: [work-packet, run-receipt]
    platform_runtime_additions: []
    lanes: [validation-selector]
  - id: workflow-runtime
    product: flow
    package: forge-flow
    package_roots: [lib/workflow]
    selectors:
      - { kind: path, prefix: "lib/workflow/" }
      - { kind: schema, prefix: "forge.flow." }
    risk_ids: [monitor-cleanup, contract-compatibility]
    canonical_test_ids: ["test/workflow/**/*.test.js"]
    dependent_routes: [flow-memory-contract]
    platform_runtime_additions: [windows-process, linux-process, macos-process]
    lanes: [flow-package]

unknown_owner_fallback:
  lane: repository-baseline
  required_gates: [G0, G1, G3, G6]
