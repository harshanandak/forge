schemaVersion: forge.config/1
values:
  lanes:
    tiers:
      security:
        - .forge/config.yaml
        - src/core/trust/**
        - src/core/state/**
        - src/adapters/store-sqlite/**
        - src/adapters/fs/**
        - src/adapters/process/**
        - templates/delivery/harness/**
        - .github/workflows/**
        - package.json
        - bun.lock
        - migrations/**
      code:
        - src/**
        - tools/**
        - templates/**
        - bin/**
        - schemas/**
    roles:
      builder: { harness: codex, model: gpt-6.1-sol, effort: high }
      fixer: { harness: codex, model: gpt-6.1-sol, effort: high }
      reviewer: { harness: codex, model: gpt-6.1-sol, effort: high }
      tester: { harness: codex, model: gpt-6.1-terra, effort: max }
blocks:
  agent:
    source:
      builtin: forge/agent
  work:
    source:
      builtin: forge/work
    config:
      claimTtlSeconds: 7200
      labelOrder:
        - p0
        - p1
        - p2
        - p3
        - p4
  memory:
    source:
      builtin: forge/memory
    config:
      scope: forge
  check:
    source:
      builtin: forge/check
    config:
      gate:
        requiredChecks: ["CI Gate"]
        receiptChecks: ["typecheck", "structure"]
      commands:
        agent-regression: bun test test/blocks/agent test/integration/agent test/assembly/providers test/assembly/config-defaults test/assembly/first-run/first-run.test.ts --path-ignore-patterns '**/packed.integration.test.ts'
        memory-rules-regression: bun test test/blocks/memory/rules.test.ts test/blocks/memory/catalog.test.ts test/blocks/memory/recipes.integration.test.ts test/assembly/shared-store/shared-store.integration.test.ts
        acl-regression: bun test test/adapters/l5-state test/assembly/sqlite-acl.integration.test.ts test/assembly/state-acl-cli.integration.test.ts
        session-identity: bun test test/assembly/session-identity/packed.integration.test.ts
        skills-regression: bun test test/surface/skills.test.ts test/assembly/template-skills/template-skills.test.ts test/templates/delivery/delivery-template.test.ts
        work-regression: bun test test/blocks/l7-work test/contract test/assembly/config-defaults test/core/config-defaults test/core/l4-config test/core/l2-runtime/shipped-trust.test.ts test/core/l2-runtime/input-errors.test.ts test/surface/held-lease.test.ts --path-ignore-patterns '**/packed.integration.test.ts'
        receipt-regression: bun test test/blocks/l9-check/gate.test.ts test/blocks/l7-work/close.test.ts test/assembly/shared-store/shared-store.integration.test.ts test/templates/delivery/delivery-template.test.ts
        typecheck: bun run check
        test: bun run test:unit
        structure: bun run test:structure
owners:
  /blocks/work/config/labelOrder:
    from: harsha/delivery@0.1.0
    baseline: sha256:71a0ad5cb60e33c1797dcc178f91aff8ccdfd69db22cc30ab4ec10db91a6778c
  /blocks/check/source:
    from: harsha/delivery@0.1.0
    baseline: sha256:044a54361c2e8d913b36867a7d902e8ce665bd955c4ca6d57c053d6d741561f0
templates:
