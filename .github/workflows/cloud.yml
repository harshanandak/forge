name: Cloud claims

# The claim server under cloud/ runs its conformance checks against a local `wrangler dev`, and its
# deploy bundle is built with `wrangler deploy --dry-run`. The Worker bundles code from src/ (ports,
# contract, core state, blocks, assembly, adapters), generated modules (schemas/ and tools/gen/) and the
# root lockfile and tsconfig, so a change to any of them runs this workflow.
on:
  pull_request:
    paths:
      - "cloud/**"
      - "src/**"
      - "schemas/**"
      - "tools/gen/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  conformance:
    name: Cloud conformance (wrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUD_BASE: http://127.0.0.1:8787
      # A throwaway admin token for this job only; no deployed Worker uses it.
      CLOUD_ADMIN_TOKEN: ci-conformance-admin-token
      # The one project the typed /command route admits, and the prefix its issue ids show.
      FORGE_CLOUD_PROJECT: ci-commands
      FORGE_CLOUD_ID_PREFIX: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # The claim server imports Forge's state owner, which needs the generated validators.
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun install --frozen-lockfile
        working-directory: cloud
      - name: Conformance checks
        working-directory: cloud
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          export CONFORMANCE_STATE="$RUNNER_TEMP/conformance-state.json"
          persist="$RUNNER_TEMP/wrangler-state"
          start() {
            bun x wrangler dev --local --config "${config:-wrangler.test.jsonc}" --var ADMIN_TOKEN:"$CLOUD_ADMIN_TOKEN" --var FORGE_CLOUD_PROJECT:"$FORGE_CLOUD_PROJECT" --var FORGE_CLOUD_ID_PREFIX:"$FORGE_CLOUD_ID_PREFIX" ${vars:-} --persist-to "$persist" > "$RUNNER_TEMP/wrangler-$1.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/wrangler.pid"
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null "$CLOUD_BASE/p/ready/holder?subject=ready"; then return 0; fi
              sleep 1
            done
            echo "::error::wrangler dev did not answer within 60 seconds"
            cat "$RUNNER_TEMP/wrangler-$1.log"
            return 1
          }
          stop() {
            pkill -P "$(cat "$RUNNER_TEMP/wrangler.pid")" || true
            kill "$(cat "$RUNNER_TEMP/wrangler.pid")" || true
            sleep 2
            pkill -f workerd || true
            for _ in $(seq 1 20); do
              if ! curl -s -o /dev/null "$CLOUD_BASE/"; then return 0; fi
              sleep 0.5
            done
            echo "::error::wrangler dev did not stop"
            return 1
          }
          # The dump counterfactuals below edit src/dump.ts; it is restored here even when a step fails.
          trap 'pkill -f workerd || true; git checkout -- src/dump.ts || true' EXIT
          # Budget cases (forge-1304): each runs in its own Worker, and its elapsed seconds are summed in a file because
          # some run in subshells. The client and workerd peak resident sizes are printed and held to their budgets.
          spent() { echo "$1" >> "$RUNNER_TEMP/budget.secs"; }
          measured() {
            label="$1"; shift
            if [ -x /usr/bin/time ]; then
              /usr/bin/time -v -o "$RUNNER_TEMP/$label.time" "$@" 2>&1 | tee "$RUNNER_TEMP/$label.out"
              kb=$(sed -n 's/.*Maximum resident set size (kbytes): //p' "$RUNNER_TEMP/$label.time")
            else
              "$@" 2>&1 | tee "$RUNNER_TEMP/$label.out"
              kb=""
            fi
            echo "client peak RSS $label: ${kb:-NOT_EXECUTED} kB (budget 262144 kB)"
            [ -z "$kb" ] || [ "$kb" -lt 262144 ] || { echo "::error::$label: the client peak RSS is over 256 MiB"; exit 1; }
          }
          workerd_rss() {
            kb=$(for p in $(pgrep -x workerd || true); do sed -n 's/^VmHWM:[[:space:]]*\([0-9]*\) kB/\1/p' "/proc/$p/status"; done | sort -n | tail -n 1)
            echo "workerd peak RSS $1: ${kb:-NOT_EXECUTED} kB (budget 524288 kB)"
            [ -z "$kb" ] || [ "$kb" -lt 524288 ] || { echo "::error::$1: workerd peak RSS is over 512 MiB"; exit 1; }
          }
          # A case with its own Worker limits (vars) and fresh persistence; `phase...` is the conformance phase and its arguments.
          budget_case() {
            name="$1"; shift
            begin=$SECONDS
            persist="$RUNNER_TEMP/wrangler-$name"
            start "$name"
            measured "$name" bun conformance/conformance.ts "$@"
            workerd_rss "$name"
            stop
            spent $((SECONDS - begin))
          }
          # Edits src/dump.ts in this disposable checkout, proves the edit changed exactly one line, starts a fresh Worker
          # (with the vars and the config the caller set), runs only the named journey and needs that journey's row to
          # fail with its byte message. An import error, a startup failure or another failed row does not count.
          budget_counterfactual() {
            name="$1"; edit="$2"; row="$3"; message="$4"; shift 4
            begin=$SECONDS
            sed -i "$edit" src/dump.ts
            if [ "$(git diff -U0 -- src/dump.ts | grep -c '^-[^-]')" != 1 ]; then echo "::error::the $name counterfactual edit did not change exactly one line"; exit 1; fi
            persist="$RUNNER_TEMP/wrangler-$name"
            start "$name"
            if bun conformance/conformance.ts "$@" > "$RUNNER_TEMP/$name.out" 2>&1; then
              echo "::error::$row passed with the $name counterfactual"; exit 1
            fi
            cat "$RUNNER_TEMP/$name.out"
            grep -Eq "^FAIL $row: $message" "$RUNNER_TEMP/$name.out" || { echo "::error::$name: $row did not fail as intended"; exit 1; }
            stop
            git checkout -- src/dump.ts
            spent $((SECONDS - begin))
          }
          bun conformance/store-join.ts
          start first
          bun conformance/conformance.ts main
          stop
          start second
          bun conformance/conformance.ts restart
          stop
          # Large phase: the largest legal project at the Worker's default limits (4 MiB pages, 8 MiB project,
          # 10,000 rows), so the small caps above are removed from a copy of the same config. It has its own
          # persistence directory, and the restored target is the admitted command project.
          sed '/"DUMP_/d' wrangler.test.jsonc > wrangler.large.jsonc
          ! grep -q DUMP_ wrangler.large.jsonc || { echo "::error::the small dump caps are still in the large config"; exit 1; }
          (
            export FORGE_CLOUD_PROJECT=ci-large config=wrangler.large.jsonc
            persist="$RUNNER_TEMP/wrangler-large"
            start large
            measured large bun conformance/conformance.ts large
            workerd_rss large
            stop
          )
          # The maximum journey's own time counts toward the added time of the budget cases.
          ms=$(sed -n 's/^INFO budget maximum: .*: \([0-9]*\) ms$/\1/p' "$RUNNER_TEMP/large.out")
          spent $(( ${ms:-0} / 1000 ))
          # Budget cases (forge-1304). The exact and cursor runs get page budgets that are byte sizes the oracle computes from
          # accepted rows before the Worker starts; the body run raises the page and stored caps to the 8 MiB restore body.
          begin=$SECONDS
          exact=$(bun conformance/conformance.ts budget-plan exact | sed -n 's/^PLAN //p')
          cursor=$(bun conformance/conformance.ts budget-plan cursor | sed -n 's/^PLAN //p')
          [ -n "$exact" ] && [ -n "$cursor" ] || { echo "::error::budget-plan printed no page size"; exit 1; }
          echo "budget plan: exact page $exact bytes, cursor page $cursor bytes"
          spent $((SECONDS - begin))
          vars="--var DUMP_PAGE_BYTES:$exact" BUDGET_PAGE_BYTES="$exact" budget_case budget budget
          vars="--var DUMP_PAGE_BYTES:$cursor" BUDGET_PAGE_BYTES="$cursor" budget_case cursor budget-cursor
          vars="--var DUMP_PAGE_BYTES:8388608 --var DUMP_MAX_BYTES:8388608 --var DUMP_MAX_ROWS:100" budget_case body budget-body
          # Counterfactuals for the budget journeys. Leaving the envelope out of the page budget overfills the continuation
          # page of the small journey; cutting by UTF-16 units instead of UTF-8 bytes overfills a maximum page, whose fixture
          # holds three-byte text so the unit count falls short; turning the page fit check from > into >= cuts the exact page.
          vars="--var DUMP_PAGE_BYTES:$exact" BUDGET_PAGE_BYTES="$exact" budget_counterfactual envelope 's/byteLength(pageOf(from.p, bare, after.done ? null : here)) +/0 +/' "budget envelope: real continuation pages stay within their budget" "page [0-9]+ is [0-9]+ bytes, over the [0-9]+ byte budget" budget "budget envelope"
          vars="--var DUMP_PAGE_BYTES:$exact" BUDGET_PAGE_BYTES="$exact" budget_counterfactual inclusive 's/^        added >$/        added >=/' "budget exact: real final page restores at its inclusive limit" "the export was cut into [0-9]+ pages" budget "budget exact"
          FORGE_CLOUD_PROJECT=ci-large config=wrangler.large.jsonc budget_counterfactual units 's/encoder.encode(JSON.stringify(value)).length;/JSON.stringify(value).length;/' "budget maximum: real grown pages restore exactly" "page [0-9]+ is [0-9]+ bytes, over the 4194304 byte budget" large "budget maximum"
          rm -f wrangler.large.jsonc
          added=$(awk '{ s += $1 } END { print s + 0 }' "$RUNNER_TEMP/budget.secs")
          echo "budget cases added $added seconds of wall time (allowance 180)"
          [ "$added" -le 180 ] || { echo "::error::the budget cases took $added seconds, over the 180 second allowance"; exit 1; }
          # Counterfactual: with the revoked-token check skipped, the revoke check must fail.
          sed -i 's/=> row.revoked_at !== null;/=> false;/' src/tokens.ts
          grep -q 'boolean => false;' src/tokens.ts || { echo "::error::the counterfactual edit did not apply"; exit 1; }
          persist="$RUNNER_TEMP/wrangler-counterfactual"
          start counterfactual
          if bun conformance/conformance.ts revoke > "$RUNNER_TEMP/counterfactual.out" 2>&1; then
            echo "::error::the revoke check passed with the revoked-token check skipped"
            exit 1
          fi
          cat "$RUNNER_TEMP/counterfactual.out"
          grep -q 'FAIL a revoked token is refused on its next request' "$RUNNER_TEMP/counterfactual.out" || { echo "::error::the counterfactual failed for another reason"; exit 1; }
          stop
          git checkout -- src/tokens.ts
          # Counterfactuals for the device approval fix (forge-1230). Each edits the source, proves the edit
          # applied, runs only the device journeys and needs exactly the named rows to fail.
          counterfactual() {
            name="$1"; file="$2"; edit="$3"; shift 3
            sed -i "$edit" "$file"
            if git diff --quiet -- "$file"; then echo "::error::the $name counterfactual edit did not apply"; exit 1; fi
            # An edit that must change several places names how many lines it removed.
            if [ -n "${edits:-}" ] && [ "$(git diff -U0 -- "$file" | grep -c '^-[^-]')" != "$edits" ]; then echo "::error::the $name counterfactual edit did not change $edits lines"; exit 1; fi
            persist="$RUNNER_TEMP/wrangler-$name"
            start "$name"
            if bun conformance/conformance.ts device > "$RUNNER_TEMP/$name.out" 2>&1; then
              echo "::error::the device journeys passed with the $name counterfactual"; exit 1
            fi
            cat "$RUNNER_TEMP/$name.out"
            for row in "$@"; do
              grep -q "FAIL $row" "$RUNNER_TEMP/$name.out" || { echo "::error::$name: row not failed: $row"; exit 1; }
            done
            stop
            git checkout -- "$file"
          }
          # An unconditional upsert writes the login row on a wrong ticket.
          counterfactual upsert src/auth/project-login.ts 's/if (after !== before)/if (true)/' "device approve: wrong capabilities" "device deny: wrong capabilities"
          # Consuming the state before its cookie is checked burns it for the right browser.
          counterfactual consume src/auth/device-browser.ts 's/if (!owned) return undefined;/if (!owned) { state.browser = []; return undefined; }/' "device approve: wrong capabilities" "device deny: wrong capabilities"
          # Without the admission guard there is no sixth-attempt refusal.
          counterfactual admission src/auth/project-login.ts 's/if (full) return false;/if (false) return false;/' "device: the sixth attempt for one challenge" "device: the sixth attempt from one address" "device: six overlapping attempts admit exactly five"
          # Charging the budget before the proof on both paths (forge-1303) refuses a right ticket or state
          # once a guess budget is full. Two lines change: the POST guard and the callback guard.
          edits=2 counterfactual budget src/auth/device-browser.ts '/^ *row === undefined &&$/d;s/if (!owned && !browserAttempt(/if (!browserAttempt(/' "device: the sixth attempt for one challenge" "device: the sixth attempt from one address" "device approve: bound proofs finish" "device deny: bound proofs finish"
      - name: wrangler log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP"/wrangler-*.log || true

  bundle:
    name: Cloud bundle (wrangler deploy --dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun install --frozen-lockfile
        working-directory: cloud
      - name: Path filter covers the Worker's dependencies
        run: |
          regexes=$(sed -n '/^    paths:/,/^permissions:/p' .github/workflows/cloud.yml | sed -n 's/^      - "\(.*\)"$/\1/p' | sed -e 's/\./\\./g' -e 's/\*\*/@@/g' -e 's/\*/[^\/]*/g' -e 's/@@/.*/g')
          matches() { while read -r re; do [[ $1 =~ ^$re$ ]] && return 0; done <<< "$regexes"; return 1; }
          for path in src/blocks/work/forge.block.json src/assembly/oidc.ts src/adapters/oidc/index.ts src/core/config/pointer.ts tools/gen/types.ts schemas/Lease.json package.json bun.lock tsconfig.build.json cloud/src/worker.ts; do
            matches "$path" || { echo "::error::$path does not trigger this workflow"; exit 1; }
          done
          for path in docs/reference/cloud.md README.md; do
            if matches "$path"; then echo "::error::$path must not trigger this workflow"; exit 1; fi
          done
      - name: Preflight refuses placeholders and missing values
        working-directory: cloud
        run: |
          sed -e 's/<account-id>/0123456789abcdef0123456789abcdef/' -e 's/<kv-namespace-id>/fedcba9876543210fedcba9876543210/' -e 's/<worker-name>/forge-cloud-ci/' -e 's#<clerk-frontend-api-url>#https://clerk.ci.test#' -e 's/<clerk-client-id>/ci-client/' -e 's#<worker-origin>#https://forge-cloud-ci.ci.test#' -e 's/<owner-subject>/user_CI1/' -e 's/<project-name>/ci-project/' -e 's/<id-prefix>/ci/' wrangler.example.jsonc > wrangler.ci.jsonc
          cat > "$RUNNER_TEMP/stub.mjs" <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";
          const a = process.argv.slice(2);
          appendFileSync(process.env.STUB_LOG, `${a[0]} ${a[1]}\n`);
          if (a[1] === "put") { console.error(readFileSync(a[a.indexOf("--config") + 1], "utf8")); process.exit(1); }
          if (a[0] === "secret") console.log(JSON.stringify(process.env.STUB_SECRETS.split(",").map((name) => ({ name }))));
          else if (a[0] === "kv") console.log(JSON.stringify([{ id: "fedcba9876543210fedcba9876543210" }]));
          else process.exit(1);
          EOF
          export FORGE_WRANGLER="$RUNNER_TEMP/stub.mjs" STUB_LOG="$RUNNER_TEMP/stub.log"
          both=DEVICE_LOGIN_HMAC_KEY,ADMIN_TOKEN
          run() { : > "$STUB_LOG"; STUB_SECRETS="$1" node scripts/preflight.mjs --config "$2" > "$RUNNER_TEMP/pre.out" 2>&1; }
          refuse() {
            if run "$1" "$2"; then echo "::error::preflight passed: $3"; exit 1; fi
            grep -q "$3" "$RUNNER_TEMP/pre.out" || { echo "::error::preflight refused for another reason: $3"; cat "$RUNNER_TEMP/pre.out"; exit 1; }
            if grep -q PRIVATEMARKER "$RUNNER_TEMP/pre.out"; then echo "::error::the output echoed config text: $3"; exit 1; fi
            if grep -q '^deploy' "$STUB_LOG"; then echo "::error::a deploy was invoked: $3"; exit 1; fi
          }
          cp wrangler.example.jsonc "$RUNNER_TEMP/placeholders.jsonc"
          sed '/FORGE_OWNER_SUBJECT/d' wrangler.ci.jsonc > "$RUNNER_TEMP/no-owner.jsonc"
          printf '{ "vars": { "FORGE_OWNER_SUBJECT": user_PRIVATEMARKERONE } }' > "$RUNNER_TEMP/bad1.jsonc"
          sed 's/"preview_urls": false/"preview_urls": true/' wrangler.ci.jsonc > "$RUNNER_TEMP/preview.jsonc"
          sed 's/"workers_dev": true/"workers_dev": false/' wrangler.ci.jsonc > "$RUNNER_TEMP/devhost.jsonc"
          sed 's/"OAUTH_TIMEOUT_MS": "5000"/"OAUTH_TIMEOUT_MS": "2147483648"/' wrangler.ci.jsonc > "$RUNNER_TEMP/timeout.jsonc"
          sed "s/\"ci-project\"/\"$(printf 'a%.0s' $(seq 65))\"/" wrangler.ci.jsonc > "$RUNNER_TEMP/longname.jsonc"
          refuse "$both" wrangler.example.jsonc "pass --config"
          refuse "$both" "$RUNNER_TEMP/timeout.jsonc" "var OAUTH_TIMEOUT_MS"
          refuse "$both" "$RUNNER_TEMP/longname.jsonc" "var FORGE_CLOUD_PROJECT"
          for value in null false 0 '""'; do
            printf '%s' "$value" > "$RUNNER_TEMP/primitive.jsonc"
            refuse "$both" "$RUNNER_TEMP/primitive.jsonc" "could not be read or parsed"
          done
          refuse "$both" "$RUNNER_TEMP/bad1.jsonc" "could not be read or parsed"
          refuse "$both" "$RUNNER_TEMP/preview.jsonc" "differs from the example"
          refuse "$both" "$RUNNER_TEMP/devhost.jsonc" "differs from the example"
          refuse "$both" "$RUNNER_TEMP/placeholders.jsonc" "placeholder"
          [ ! -s "$STUB_LOG" ] || { echo "::error::wrangler was called before the local checks passed"; exit 1; }
          refuse "$both" "$RUNNER_TEMP/no-owner.jsonc" "var FORGE_OWNER_SUBJECT"
          refuse ADMIN_TOKEN wrangler.ci.jsonc "secret DEVICE_LOGIN_HMAC_KEY is not set"
          run "$both" wrangler.ci.jsonc || { cat "$RUNNER_TEMP/pre.out"; echo "::error::preflight refused a complete config"; exit 1; }
          # The Worker's own config rules and the required vars. A failing input holds PRIVATEMARKER. A refusal is
          # local: it names the var, calls no wrangler, and echoes neither the input nor any error text.
          # Every case runs, then the step fails.
          cat > "$RUNNER_TEMP/cfg.mjs" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const [out, ...edits] = process.argv.slice(2);
          let text = readFileSync("wrangler.ci.jsonc", "utf8");
          for (const edit of edits) {
            const [name, raw] = edit.split(/=(.*)/s);
            const line = new RegExp(`^ *"${name}": .*\n`, "m");
            const next = raw === "" ? "" : `    "${name}": ${raw},\n`;
            text = line.test(text) ? text.replace(line, () => next) : text.replace('"vars": {\n', () => `"vars": {\n${next}`);
          }
          writeFileSync(out, text);
          EOF
          miss=0
          note() { echo "::error::$1"; miss=$((miss + 1)); }
          variant() { node "$RUNNER_TEMP/cfg.mjs" "$RUNNER_TEMP/case.jsonc" "$@"; }
          lrefuse() {
            variant "${@:2}"
            if run "$both" "$RUNNER_TEMP/case.jsonc"; then note "preflight passed: $*"; return; fi
            grep -q "$1" "$RUNNER_TEMP/pre.out" || { note "refused for another reason: $*"; return; }
            if grep -Eq 'PRIVATEMARKER|Error|^ +at ' "$RUNNER_TEMP/pre.out"; then note "the output echoed input or error text: $*"; return; fi
            [ ! -s "$STUB_LOG" ] || note "wrangler was called for a local refusal: $*"
          }
          lpass() { variant "$@"; run "$both" "$RUNNER_TEMP/case.jsonc" || { cat "$RUNNER_TEMP/pre.out"; note "preflight refused a valid config: $*"; }; }
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="http://client.ci.test/callback/PRIVATEMARKER"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://user:PRIVATEMARKER@client.ci.test/cb"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://client.ci.test/cb?PRIVATEMARKER=1"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://client.ci.test/cb#PRIVATEMARKER"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://client.ci.test/cb\\PRIVATEMARKER"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://a.ci.test/cb,,https://b.ci.test/PRIVATEMARKER"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://a.ci.test/cb,http://b.ci.test/PRIVATEMARKER"'
          lrefuse "var FORGE_OAUTH_REDIRECTS" 'FORGE_OAUTH_REDIRECTS="https://client.example.com/PRIVATEMARKER"'
          lrefuse "var CLERK_REDIRECT_URI" 'CLERK_REDIRECT_URI="not a url PRIVATEMARKER"'
          lrefuse "var CLERK_REDIRECT_URI" 'CLERK_REDIRECT_URI=["PRIVATEMARKER"]'
          lrefuse "var CLERK_CLIENT_ID" 'CLERK_CLIENT_ID="placeholder-PRIVATEMARKER"'
          lrefuse "var CLERK_ISSUER" 'CLERK_ISSUER="https://clerk.example.PRIVATEMARKER"'
          lrefuse "var FORGE_OWNER_SUBJECT" 'FORGE_OWNER_SUBJECT='
          lrefuse "var FORGE_OWNER_SUBJECT" 'FORGE_OWNER_SUBJECT="user_PRIVATEMARKER!"'
          lrefuse "var FORGE_CLOUD_PROJECT" 'FORGE_CLOUD_PROJECT='
          lrefuse "var FORGE_CLOUD_ID_PREFIX" 'FORGE_CLOUD_ID_PREFIX='
          lrefuse "var FORGE_CLOUD_ID_PREFIX" 'FORGE_CLOUD_ID_PREFIX="Forge-PRIVATEMARKER"'
          lrefuse "var FORGE_CLOUD_ID_PREFIX" 'FORGE_CLOUD_ID_PREFIX="ci-"'
          lrefuse "var FORGE_CLOUD_ID_PREFIX" 'FORGE_CLOUD_ID_PREFIX=7'
          lrefuse "var FORGE_CLOUD_ID_PREFIX" "FORGE_CLOUD_ID_PREFIX=\"$(printf 'a%.0s' $(seq 33))\""
          lpass 'FORGE_OAUTH_REDIRECTS="https://a.ci.test/cb,https://b.ci.test/cb"'
          lpass 'FORGE_CLOUD_ID_PREFIX="a1-b2"'
          # Fault: the id-prefix rule throws (its schema gains a keyword whose error text would quote the marker).
          # The refusal is still fixed and local. The schema is restored in this step.
          schema=../src/blocks/work/schemas/config.json
          sed -i 's/"idPrefix": {/"idPrefix": { "PRIVATEMARKERkeyword": true,/' "$schema"
          git diff --quiet -- "$schema" && note "the fault was not injected"
          lrefuse "var FORGE_CLOUD_ID_PREFIX"
          git checkout -- "$schema"
          # The preflight holds no copy of a Worker rule: it runs them.
          if grep -Eq 'x21-|user_\[|2_147_483_647|A-Za-z0-9\._-|const https' scripts/preflight.mjs; then note "preflight.mjs still holds a copy of a Worker rule"; fi
          [ "$miss" -eq 0 ] || { echo "::error::$miss preflight case(s) failed"; exit 1; }
          # The token helper never forwards wrangler's output: the stub echoes the config, which holds a marker.
          mkdir -m 700 "$RUNNER_TEMP/tokens"
          tok() { node scripts/set-admin-token.mjs --config "$RUNNER_TEMP/bad1.jsonc" --token-file "$RUNNER_TEMP/tokens/admin.token" > "$RUNNER_TEMP/token.out" 2>&1; }
          if tok || ! grep -q "wrangler secret put failed" "$RUNNER_TEMP/token.out" || grep -q PRIVATEMARKER "$RUNNER_TEMP/token.out"; then
            echo "::error::set-admin-token did not fail cleanly, or echoed config text"
            exit 1
          fi
      - name: Bundle with the production entry point
        working-directory: cloud
        run: |
          bun x wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir "$RUNNER_TEMP/bundle"
          [ -n "$(find "$RUNNER_TEMP/bundle" -name '*.js' -size +0 -print -quit)" ] || { echo "::error::no bundle was written"; exit 1; }
          # Counterfactual: an import that cannot resolve must fail the bundle, for that import.
          trap 'git checkout -- src/issue-commands.ts' EXIT
          sed -i '1i import "../../src/blocks/work/missing.block.json" with { type: "json" };' src/issue-commands.ts
          if bun x wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir "$RUNNER_TEMP/broken" > "$RUNNER_TEMP/broken.out" 2>&1; then
            echo "::error::the bundle built with an unresolved import"
            exit 1
          fi
          git checkout -- src/issue-commands.ts
          grep -q 'missing.block.json' "$RUNNER_TEMP/broken.out" || { cat "$RUNNER_TEMP/broken.out"; echo "::error::the bundle failed for another reason"; exit 1; }
