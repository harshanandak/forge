# Bypass for required checks when path-filtered workflows don't trigger.
#
# Problem: test workflows use `paths:` filters so they only run when code files
# change. But these checks are marked Required in branch protection. For
# markdown-only PRs, the real workflows never run, so GitHub shows "Waiting for
# status" forever and blocks the merge.
#
# Solution: This workflow uses `paths-ignore:` with the same paths the real
# workflows use as `paths:`. When a PR only changes non-code files (markdown,
# configs), this workflow runs and reports success for each required check
# name. When code files change, the real workflows handle it instead.
#
# CodeQL and ESLint must run in their real workflows because branch protection
# also requires code-scanning contexts named "CodeQL" and "ESLint"; a bypass job
# cannot create those code-scanning statuses.

name: Required Checks Bypass

on:
  pull_request:
    paths-ignore:
      - 'bin/**'
      - 'lib/**'
      - 'scripts/**'
      - 'packages/**'
      - 'skills/**'
      - 'package.json'
      - '*.js'
      - '.claude/**/*.js'
      - '.forge/hooks/**'
      - '.github/workflows/**'

# Limit permissions — most jobs only echo a message. The test-suite job needs
# `contents: read` to check the repo out, so it grants that at the job level.
permissions: {}

jobs:
  # Job names MUST match the required check names exactly.

  # NOT a pure echo: several suites assert on markdown CONTENT (the README
  # package-size badge, the AGENTS.md convention section, docs consistency).
  # Echoing success here let a markdown-only PR merge green and then break master
  # for the next unrelated code PR — twice (kernel issue 63556816: #307/#310 and
  # the hotfix after #325). The full code matrix still stays skipped; only the
  # suites that read the changed markdown run. The selection is shared with the
  # local push lane via lib/doc-assertions.js, so the two cannot drift apart.
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install
      - name: Run doc-asserting suites for changed markdown
        run: node scripts/doc-asserting-tests.js --base ${{ github.event.pull_request.base.sha }}

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes — coverage check not needed"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes — E2E tests not needed"

  test-dashboard:
    name: Test Dashboard (PR)
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes — dashboard not needed"

  cross-os-gate:
    name: Cross-OS Gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes — cross-OS smoke not needed"
