name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned Bun for check, test, build and pack smoke. `bun fmt` is stable in 1.4.4;
  # `bun lint` still needs the canary build used by the `static` job.
  BUN_VERSION: "1.4.4"
  CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_BUILD_SHA: ${{ github.sha }}
  COMMENT_GUARD_PATHS: >-
    tools/checks tools/lint tools/git-executable.ts tools/bun-builtin.ts
    tools/bun-lint-version.json test/structure/no-comments.integration.test.ts
    package.json bun.lock bunfig.toml .forge/config.yaml

defaults:
  run:
    shell: bash

jobs:
  # Heavy legs are skipped when a pull request changes only documentation.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
      comment_guard: ${{ steps.diff.outputs.comment_guard }}
      started: ${{ steps.start.outputs.at }}
      tier: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (github.event.pull_request.draft && 'quick' || 'merge') || 'full' }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun tools/ci/change-scope.ts | tee -a "$GITHUB_OUTPUT"

  pr-title:
    name: PR title
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.tier != 'quick'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must be a conventional commit title (for example 'fix: handle a moved head'); it becomes the squash-merge title and changelog line."
            exit 1
          fi

  # Always runs: guards and formatting also apply to documentation changes.
  structure:
    name: ${{ needs.changes.outputs.tier == 'quick' && 'Quick' || 'Structure guards' }}
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - &start-record
        name: Start timing record
        run: |
          touch "$RUNNER_TEMP/ci-tests.log"
          echo '{"version":1,"files":{}}' > "$RUNNER_TEMP/ci-timings.json"
          echo "CI_NODE=${CI_NODE:-$(node -p 'process.versions.node.split(".")[0]')}" >> "$GITHUB_ENV"
          echo "CI_JOB_STARTED=$(date +%s)000" >> "$GITHUB_ENV"
          echo "CI_TIMINGS=$RUNNER_TEMP/ci-timings.json" >> "$GITHUB_ENV"
          echo "FORGE_TEST_TIMINGS_ARG=--timings=$RUNNER_TEMP/ci-timings.json" >> "$GITHUB_ENV"
          echo "FORGE_TEST_UPDATE_ARG=--update-timings" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
      - &lint-runtime
        id: lint-runtime
        run: node tools/ci/preserve-lint-runtime.ts prepare
      - &install-lint-runtime
        run: npm install --prefix "$RUNNER_TEMP/comment-lint" --ignore-scripts --no-save "${{ steps.lint-runtime.outputs.package }}"
      - &preserve-lint-runtime
        run: node tools/ci/preserve-lint-runtime.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: node tools/checks/no-comments.ts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: cloud
      - run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
        working-directory: hub
      - run: bun run test:structure --timings="$CI_TIMINGS" --update-timings 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - name: Select the pinned lint Bun for Quick
        if: needs.changes.outputs.tier == 'quick'
        run: dirname "$FORGE_LINT_BUN" >> "$GITHUB_PATH"
      - name: Quick lint, format and typecheck
        if: needs.changes.outputs.tier == 'quick'
        run: |
          bun run lint
          bun run fmt --check
          bun run check
      - name: Check merges from main
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base_commit=$(git show-ref --verify --hash "refs/remotes/origin/$BASE_REF")
          base_tree="$RUNNER_TEMP/merge-check-base"
          git worktree add --detach "$base_tree" "$base_commit"
          checker="$base_tree/tools/ci/merge-from-main.ts"
          test -f "$checker"
          echo "Running base merge checker at $base_commit: $checker"
          bun "$checker"
      - &write-record
        if: always()
        run: bun tools/ci/ci-record.ts
      - &upload-record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-record-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-record.json
          if-no-files-found: error

  static:
    name: Lint and format
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.tier != 'quick'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
      - *lint-runtime
      - *install-lint-runtime
      - *preserve-lint-runtime
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: cloud
      - run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
        working-directory: hub
      - run: bun run lint
      - run: bun run fmt --check

  pack:
    name: Pack artifact
    needs: changes
    if: needs.changes.outputs.scope == 'full' && needs.changes.outputs.tier != 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_BUILD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Pack and hash once
        id: pack
        run: |
          bun run build
          node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
          mv "$RUNNER_TEMP/$tarball" "$RUNNER_TEMP/forge-workflow.tgz"
          cd "$RUNNER_TEMP"
          digest=$(sha256sum forge-workflow.tgz | cut -d' ' -f1)
          printf '%s  forge-workflow.tgz\n' "$digest" | tee forge-workflow.tgz.sha256
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-package
          path: ${{ runner.temp }}/forge-workflow.tgz*
          if-no-files-found: error
      - name: Packed type resolutions
        run: bun run check:attw "$RUNNER_TEMP/forge-workflow.tgz"

  # Speed gate (forge-955): the built CLI must stay fast and light. The table lands in the job
  # summary; `issue show` over its limit fails the job, and ci-gate requires it.
  speed:
    name: Speed (${{ matrix.os }}, Node 24)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.scope == 'full' && needs.changes.outputs.tier != 'quick'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &speed-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &windows-storsvc-off
        name: Disable the Storage Service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/scripts/disable-storsvc.ps1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:team
      # The speed gate compares this build with the base branch's, built here and run on the same runner.
      - name: Check out the base branch
        id: speed-base-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          path: base
          persist-credentials: false
      - name: Build the base branch
        id: speed-base-build
        working-directory: base
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Report an unavailable Speed base
        if: failure() && (steps.speed-base-checkout.outcome == 'failure' || steps.speed-base-build.outcome == 'failure')
        shell: bash
        run: echo 'Speed memory comparison incomplete. The base checkout or build failed.' >> "$GITHUB_STEP_SUMMARY"
      - name: CLI speed
        run: node tools/bench/cli-speed.ts --gate --base base/dist
      # A report, not a gate: a failure here must not fail the required Speed check.
      - name: CLI footprint
        if: always()
        continue-on-error: true
        env:
          FORGE_BASE_DIST: ${{ github.workspace }}/base/dist
        run: node tools/bench/footprint.ts

  speed-windows:
    name: Speed main (${{ matrix.os }}, Node 24)
    needs: changes
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps: *speed-steps

  comment-guard:
    name: Comment guard (windows-latest, Node 24)
    needs: changes
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.comment_guard == 'true') && needs.changes.outputs.tier != 'quick'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI_NODE: "24"
      CI_SHARD: comment-guard
    steps:
      - *start-record
      - name: Keep Windows test temp files on the workspace disk
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
      - *windows-storsvc-off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - *lint-runtime
      - *install-lint-runtime
      - *preserve-lint-runtime
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Admit comment guard on Windows
        run: |
          read -ra paths <<< "$COMMENT_GUARD_PATHS"
          guards=()
          for path in "${paths[@]}"; do guards+=(--guard "$path"); done
          bun tools/check-admit.ts no-comments-regression test/structure/fixtures/no-comments-break.patch "${guards[@]}" 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - *write-record
      - *upload-record

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.suite != 'all' && format(', {0}', matrix.suite) || '' }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: [changes, pack]
    if: github.event_name != 'schedule' && needs.changes.outputs.scope == 'full' && needs.changes.outputs.tier != 'quick'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS hosted runners are capacity-limited and jobs were never picked up (PRs #46, #50).
        # macOS and Linux each split their Node 24 tests into two shards (Linux Node 26 too);
        # only shard 1 also runs pack smoke. One Linux job took 7.6 min at the median (forge-852).
        # Windows splits tests and pack smoke into two jobs: together they reached 1095 s of the
        # 1200 s limit once the spawn-heavy files ran serially (forge-648).
        # Each Windows tests leg now has three time-balanced shards; spawn-heavy files
        # stay serial inside each shard. Pack and the other platforms retain their coverage.
        # Timings: median Windows Node 24 file times over 12 main runs (forge-852); serial files
        # weigh 2.5x because they run alone while parallel files overlap.
        # Assignment spans unit, parallel integration and serial integration together.
        include:
          - { os: ubuntu-latest, node: "24", suite: all, shard: "1/2" }
          - { os: ubuntu-latest, node: "24", suite: tests, shard: "2/2" }
          - { os: windows-latest, node: "24", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "3/3" }
    steps: &verify-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.os == 'Windows' && 'npm' || '' }}
          cache-dependency-path: bun.lock
      - uses: ./.github/actions/journey-setup
        with:
          mode: ci
          node: ${{ matrix.node }}
          shard: ${{ matrix.shard || matrix.suite }}
          artifact: ${{ matrix.suite != 'tests' && format('{0}/packed/forge-workflow.tgz', runner.temp) || '' }}
          sha256: ${{ needs.pack.outputs.sha256 }}
          version: ${{ needs.pack.outputs.version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Windows only: installs take 3-10 s there against about 0.2 s on Linux and macOS.
      - id: bun-cache
        if: runner.os == 'Windows'
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - if: matrix.suite != 'pack'
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: cloud
      - if: matrix.suite != 'pack'
        run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
        working-directory: hub
      - name: Start Windows runner trace
        if: runner.os == 'Windows'
        continue-on-error: true
        run: bun tools/ci/windows-trace.ts start
      - if: matrix.suite != 'pack'
        run: bun run check
      - name: Build hub
        if: matrix.suite != 'pack'
        run: bun run build:hub
      - name: Unit tests
        if: matrix.suite != 'pack'
        run: ${{ matrix.shard && format('bun tools/ci/test-shards.ts test:unit {0} {1}', matrix.shard, matrix.node == '26' && '--node26' || '') || 'bun run test:unit' }} 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - name: Integration tests
        if: matrix.suite != 'pack'
        run: ${{ matrix.shard && format('bun tools/ci/test-shards.ts test:integration {0} {1}', matrix.shard, matrix.node == '26' && '--node26' || '') || 'bun run test:integration' }} 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - if: matrix.suite != 'tests'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packed-package
          path: ${{ runner.temp }}/packed
      - name: Pack smoke
        if: matrix.suite != 'tests'
        run: bun run test:pack 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - *write-record
      - *upload-record
      - name: Stop and summarize Windows runner trace
        id: trace
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          "shard=$('${{ matrix.shard || 'pack' }}'.Replace('/', '-'))" >> $env:GITHUB_OUTPUT
          bun tools/ci/windows-trace.ts stop
          if (Test-Path "$env:RUNNER_TEMP/windows-trace.jsonl.error") { Get-Content "$env:RUNNER_TEMP/windows-trace.jsonl.error" }
      - name: Upload Windows runner trace
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-trace-node-${{ matrix.node }}-${{ matrix.suite }}-${{ steps.trace.outputs.shard || strategy.job-index }}
          path: |
            ${{ runner.temp }}/windows-trace.jsonl
            ${{ runner.temp }}/windows-trace.jsonl.error
            ${{ runner.temp }}/windows-trace.jsonl.blg
          retention-days: 7
          if-no-files-found: warn

  verify-main:
    name: Verify main (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.suite != 'all' && format(', {0}', matrix.suite) || '' }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: [changes, pack]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.scope == 'full' && needs.changes.outputs.tier != 'quick')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "26", suite: all, shard: "1/2" }
          - { os: ubuntu-latest, node: "26", suite: tests, shard: "2/2" }
          - { os: macos-latest, node: "24", suite: all, shard: "1/2" }
          - { os: macos-latest, node: "24", suite: tests, shard: "2/2" }
          - { os: windows-latest, node: "24", suite: pack }
    steps: *verify-steps

  verify-node26:
    name: Verify Node 26 (${{ matrix.os }}, ${{ matrix.suite }}) ${{ matrix.shard }}
    needs: pack
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: "26", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "26", suite: pack }
          - { os: macos-latest, node: "26", suite: pack }
    steps: *verify-steps

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        changes,
        pr-title,
        structure,
        static,
        pack,
        speed,
        speed-windows,
        verify,
        verify-main,
        verify-node26,
        comment-guard,
      ]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          TIER: ${{ needs.changes.outputs.tier }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES: ${{ needs.changes.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          STRUCTURE: ${{ needs.structure.result }}
          STATIC: ${{ needs.static.result }}
          PACK: ${{ needs.pack.result }}
          SPEED: ${{ needs.speed.result }}
          SPEED_WINDOWS: ${{ needs.speed-windows.result }}
          VERIFY: ${{ needs.verify.result }}
          VERIFY_MAIN: ${{ needs.verify-main.result }}
          VERIFY_NODE26: ${{ needs.verify-node26.result }}
          COMMENT_GUARD: ${{ needs.comment-guard.result }}
          GUARD_CHANGED: ${{ needs.changes.outputs.comment_guard }}
          STARTED: ${{ needs.changes.outputs.started }}
        run: |
          if [ -n "$STARTED" ]; then
            wall=$(( $(date +%s) - STARTED ))
            echo "CI wall time: ${wall}s (budget: 12 minutes)"
            echo "CI wall time: ${wall}s" >> "$GITHUB_STEP_SUMMARY"
            if [ "$wall" -gt 720 ]; then
              echo "::warning::CI wall time ${wall}s is over the 12 minute budget; see CODING_STANDARDS.md"
            fi
          fi
          ok=1
          require() {
            if [ "$2" != "${3:-success}" ]; then
              echo "::error::$1 finished as '$2', expected '${3:-success}'"
              ok=0
            fi
          }
          require "changes" "$CHANGES"

          title=skipped
          structure=success
          static=success
          heavy=success
          packed=success
          main_only=skipped
          node26=skipped
          admission=success
          case "$EVENT:$DRAFT:$TIER" in
            pull_request:true:quick)
              static=skipped
              heavy=skipped
              packed=skipped
              admission=skipped
              draft_message="Draft PR: the quick tier ran. Mark the PR ready for review to run the merge tier."
              echo "::error::$draft_message"
              echo "$draft_message" >> "$GITHUB_STEP_SUMMARY"
              ok=0
              ;;
            pull_request:false:merge)
              title=success
              case "$GUARD_CHANGED" in
                true) ;;
                false) admission=skipped ;;
                *) echo "::error::unexpected comment guard selection '$GUARD_CHANGED'"; ok=0 ;;
              esac
              ;;
            merge_group::merge) ;;
            push::full)
              main_only=success
              node26=success
              ;;
            schedule::full)
              structure=skipped
              static=skipped
              heavy=skipped
              node26=success
              admission=skipped
              ;;
            *)
              echo "::error::unexpected CI tier '$TIER' for event '$EVENT' and draft '$DRAFT'"
              ok=0
              ;;
          esac
          case "$EVENT:$SCOPE" in
            pull_request:docs) heavy=skipped; packed=skipped ;;
            *:full) ;;
            *) echo "::error::unexpected scope '$SCOPE' for '$EVENT'"; ok=0 ;;
          esac

          require "pr-title" "$PR_TITLE" "$title"
          require "structure" "$STRUCTURE" "$structure"
          require "static" "$STATIC" "$static"
          require "pack" "$PACK" "$packed"
          require "speed" "$SPEED" "$heavy"
          require "speed-windows" "$SPEED_WINDOWS" "$main_only"
          require "verify" "$VERIFY" "$heavy"
          verify_main="$main_only"
          if [ "$EVENT" = "pull_request" ]; then verify_main="$heavy"; fi
          require "verify-main" "$VERIFY_MAIN" "$verify_main"
          require "verify-node26" "$VERIFY_NODE26" "$node26"
          require "comment-guard" "$COMMENT_GUARD" "$admission"
          [ "$ok" = "1" ]
