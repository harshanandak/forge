name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned Bun for check, test, build and pack smoke. `bun fmt` is stable in 1.4.4;
  # `bun lint` still needs the canary build used by the `static` job.
  BUN_VERSION: "1.4.4"
  CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  # Heavy legs are skipped when a pull request changes only documentation.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
      started: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope="$(bun tools/ci/change-scope.ts)"
          echo "$scope" >> "$GITHUB_OUTPUT"
          echo "$scope"

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must be a conventional commit title (for example 'fix: handle a moved head'); it becomes the squash-merge title and changelog line."
            exit 1
          fi

  # Always runs: guards and formatting also apply to documentation changes.
  structure:
    name: Structure guards
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - &start-record
        name: Start timing record
        run: |
          touch "$RUNNER_TEMP/ci-tests.log"
          echo '{"version":1,"files":{}}' > "$RUNNER_TEMP/ci-timings.json"
          echo "CI_NODE=${CI_NODE:-$(node -p 'process.versions.node.split(".")[0]')}" >> "$GITHUB_ENV"
          echo "CI_JOB_STARTED=$(date +%s)000" >> "$GITHUB_ENV"
          echo "CI_TIMINGS=$RUNNER_TEMP/ci-timings.json" >> "$GITHUB_ENV"
          echo "FORGE_TEST_TIMINGS_ARG=--timings=$RUNNER_TEMP/ci-timings.json" >> "$GITHUB_ENV"
          echo "FORGE_TEST_UPDATE_ARG=--update-timings" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
      - &lint-runtime
        id: lint-runtime
        run: node tools/ci/preserve-lint-runtime.ts prepare
      - &install-lint-runtime
        run: npm install --prefix "$RUNNER_TEMP/comment-lint" --ignore-scripts --no-save "${{ steps.lint-runtime.outputs.package }}"
      - &preserve-lint-runtime
        run: node tools/ci/preserve-lint-runtime.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: node tools/checks/no-comments.ts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: cloud
      - run: bun run test:structure --timings="$CI_TIMINGS" --update-timings 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - &write-record
        if: always()
        run: bun tools/ci/ci-record.ts
      - &upload-record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-record-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-record.json
          if-no-files-found: error

  static:
    name: Lint and format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
      - *lint-runtime
      - *install-lint-runtime
      - *preserve-lint-runtime
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: cloud
      - run: bun run lint
      - run: bun run fmt --check

  pack:
    name: Pack artifact
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Pack and hash once
        id: pack
        run: |
          bun run build
          node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
          mv "$RUNNER_TEMP/$tarball" "$RUNNER_TEMP/forge-workflow.tgz"
          cd "$RUNNER_TEMP"
          digest=$(sha256sum forge-workflow.tgz | cut -d' ' -f1)
          printf '%s  forge-workflow.tgz\n' "$digest" | tee forge-workflow.tgz.sha256
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-package
          path: ${{ runner.temp }}/forge-workflow.tgz*
          if-no-files-found: error
      - name: Packed type resolutions
        run: bun run check:attw "$RUNNER_TEMP/forge-workflow.tgz"

  # Speed gate (forge-955): the built CLI must stay fast and light. The table lands in the job
  # summary; `issue show` over its limit fails the job, and ci-gate requires it.
  speed:
    name: Speed (${{ matrix.os }}, Node 24)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:team
      # The speed gate compares this build with the base branch's, built here and run on the same runner.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
          persist-credentials: false
      - name: Build the base branch
        working-directory: base
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: CLI speed
        run: node tools/bench/cli-speed.ts --gate --base base/dist ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
      # A report, not a gate: a failure here must not fail the required Speed check.
      - name: CLI footprint
        if: always()
        continue-on-error: true
        env:
          FORGE_BASE_DIST: ${{ github.workspace }}/base/dist
        run: node tools/bench/footprint.ts

  comment-guard:
    name: Comment guard (windows-latest, Node 24)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI_NODE: "24"
      CI_SHARD: comment-guard
    steps:
      - &windows-storsvc-off
        name: Disable the Storage Service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'windows-diag'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
          $service = Get-Service StorSvc
          $hostPid = (Get-CimInstance Win32_Service -Filter "Name='StorSvc'").ProcessId
          $log = @("storsvc-before at=$((Get-Date).ToUniversalTime().ToString('o')) boot=$($boot.ToString('o')) status=$($service.Status) start=$($service.StartType) pid=$hostPid dependents=$($service.DependentServices.Name -join ',')")
          Set-Service StorSvc -StartupType Disabled
          $stopTimer = [Diagnostics.Stopwatch]::StartNew()
          Stop-Service StorSvc -Force
          $stopMs = $stopTimer.ElapsedMilliseconds
          $service = Get-Service StorSvc
          $log += "storsvc-after at=$((Get-Date).ToUniversalTime().ToString('o')) status=$($service.Status) start=$($service.StartType) stop-ms=$stopMs step-ms=$($timer.ElapsedMilliseconds)"
          $log | Tee-Object -FilePath "$dir/storsvc.txt"
          if ($service.Status -ne 'Stopped' -or $service.StartType -ne 'Disabled') { throw "StorSvc is $($service.Status) and $($service.StartType)" }
      - &windows-diag-start
        name: Start Windows diagnostics
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          DIAG_JOB: ${{ github.job }} group=storsvc-off node=${{ matrix.node }} suite=${{ matrix.suite }} shard=${{ matrix.shard }}
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'windows-diag'
          New-Item -ItemType Directory -Force -Path $dir, "$dir/tasklist" | Out-Null
          $now = (Get-Date).ToUniversalTime()
          $boot = $now.AddMilliseconds(-[Environment]::TickCount64)
          "$env:DIAG_JOB image=$env:ImageOS/$env:ImageVersion runner=$env:RUNNER_NAME start=$($now.ToString('o')) boot=$($boot.ToString('o'))" | Set-Content "$dir/job.txt"
          $counters = @(
            '\Processor(_Total)\% Processor Time'
            '\Memory\Available MBytes'
            '\Memory\Pages Input/sec'
            '\PhysicalDisk(_Total)\% Disk Time'
            '\PhysicalDisk(_Total)\Avg. Disk Queue Length'
            '\PhysicalDisk(*)\Disk Read Bytes/sec'
            '\PhysicalDisk(*)\Disk Write Bytes/sec'
            '\LogicalDisk(*)\Avg. Disk sec/Read'
            '\LogicalDisk(*)\Avg. Disk sec/Write'
            '\LogicalDisk(*)\Disk Bytes/sec'
            '\LogicalDisk(*)\Disk Read Bytes/sec'
            '\LogicalDisk(*)\Disk Reads/sec'
            '\Process(*)\IO Data Bytes/sec'
            '\Process(*)\IO Read Bytes/sec'
            '\Process(*)\IO Write Bytes/sec'
            '\Process(*)\% Processor Time'
            '\Process(*)\ID Process'
            '\Process(*)\Creating Process ID'
          )
          $counters | Set-Content -Encoding ascii "$dir/counters.txt"
          $typeperf = Start-Process "$env:SystemRoot\System32\typeperf.exe" -ArgumentList '-cf', "$dir\counters.txt", '-f', 'BIN', '-o', "$dir\counters.blg", '-si', '1', '-y' -WindowStyle Hidden -PassThru
          $typeperf.Id | Set-Content "$dir/typeperf.pid"
          $loop = Join-Path $dir 'tasklist-loop.ps1'
          @'
          param($dir)
          while (-not (Test-Path "$dir/stop")) {
            $at = (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ')
            tasklist /svc /fo csv > "$dir/tasklist/$at.csv"
            for ($i = 0; $i -lt 30 -and -not (Test-Path "$dir/stop"); $i++) { Start-Sleep -Seconds 1 }
          }
          '@ | Set-Content $loop
          Start-Process pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-File', $loop, $dir -WindowStyle Hidden
          & {
            wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
            wevtutil sl Security /ms:1073741824
            auditpol /set /subcategory:'{0CCE922B-69AE-11D9-BED3-505054503030}' /success:enable
            auditpol /set /subcategory:'{0CCE922C-69AE-11D9-BED3-505054503030}' /success:enable
            $audit = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
            if (-not (Test-Path $audit)) { New-Item -Path $audit | Out-Null }
            New-ItemProperty -Path $audit -Name ProcessCreationIncludeCmdLine_Enabled -Value 1 -PropertyType DWord -Force | Out-Null
            auditpol /get /category:'Detailed Tracking'
            wevtutil gl Microsoft-Windows-TaskScheduler/Operational
          } *>&1 | Tee-Object "$dir/setup.txt"
          Get-Content "$dir/job.txt"
      - *start-record
      - name: Keep Windows test temp files on the workspace disk
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - *lint-runtime
      - *install-lint-runtime
      - *preserve-lint-runtime
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Admit comment guard on Windows
        run: bun tools/check-admit.ts no-comments-regression test/structure/fixtures/no-comments-break.patch --guard tools/checks --guard tools/lint --guard tools/git-executable.ts --guard tools/bun-builtin.ts --guard tools/bun-lint-version.json --guard test/structure/no-comments.integration.test.ts --guard package.json --guard bun.lock --guard bunfig.toml --guard .forge/config.yaml 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - &windows-diag-hold
        name: Keep Windows diagnostics running until 16 minutes after boot
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'windows-diag'
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
          $now = (Get-Date).ToUniversalTime()
          $until = $boot.AddMinutes(16)
          $wait = [Math]::Min(900, [Math]::Max(0, [Math]::Ceiling(($until - $now).TotalSeconds)))
          "tests-end=$($now.ToString('o')) boot-wmi=$($boot.ToString('o')) hold-until=$($until.ToString('o')) hold-seconds=$wait" | Tee-Object -Append "$dir/job.txt"
          Start-Sleep -Seconds $wait
      - &windows-diag-stop
        name: Stop Windows diagnostics
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'windows-diag'
          "end=$((Get-Date).ToUniversalTime().ToString('o'))" | Add-Content "$dir/job.txt"
          New-Item -ItemType File -Force -Path "$dir/stop" | Out-Null
          & {
            wevtutil epl Microsoft-Windows-TaskScheduler/Operational "$dir\taskscheduler.evtx" /ow:true
            wevtutil epl Security "$dir\security-process.evtx" '/q:*[System[(EventID=4688 or EventID=4689)]]' /ow:true
            $logs = @('Application', 'System', 'Microsoft-Windows-Windows Defender/Operational')
            $logs += Get-WinEvent -ListLog '*Provisioning*', '*VolumeSnapshot*', '*Backup*', '*VSS*' -ErrorAction SilentlyContinue | Where-Object RecordCount | ForEach-Object LogName
            foreach ($log in $logs) { wevtutil epl $log "$dir\log-$($log -replace '[\\/ ]', '-').evtx" /ow:true }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'VSS' } -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, LevelDisplayName, Message | Export-Csv "$dir/vss-application-events.csv" -NoTypeInformation
            Get-ScheduledTask | ForEach-Object {
              $info = $_ | Get-ScheduledTaskInfo -ErrorAction SilentlyContinue
              [pscustomobject]@{ Task = $_.TaskPath + $_.TaskName; State = $_.State; LastRunTime = $info.LastRunTime; LastTaskResult = $info.LastTaskResult; NextRunTime = $info.NextRunTime }
            } | Export-Csv "$dir/scheduled-tasks.csv" -NoTypeInformation
            Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine | Export-Csv "$dir/processes-end.csv" -NoTypeInformation
            Get-Service | Select-Object Name, Status, StartType | Export-Csv "$dir/services-end.csv" -NoTypeInformation
            tasklist /svc /fo csv > "$dir/tasklist/end.csv"
            Stop-Process -Id (Get-Content "$dir/typeperf.pid") -Force
            Start-Sleep -Seconds 2
            Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "diagnostics: $($_.Count) files, $([math]::Round($_.Sum / 1MB)) MB" }
          } *>&1 | Tee-Object "$dir/stop.txt"
      - &windows-diag-upload
        name: Upload Windows diagnostics
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-diag-storsvc-off-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/windows-diag
          retention-days: 7
          if-no-files-found: warn
      - *write-record
      - *upload-record

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.suite != 'all' && format(', {0}', matrix.suite) || '' }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: [changes, pack]
    if: github.event_name != 'schedule' && needs.changes.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: &verify-env
      CI_NODE: ${{ matrix.node }}
      CI_SHARD: ${{ matrix.shard || matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        # macOS hosted runners are capacity-limited and jobs were never picked up (PRs #46, #50).
        # macOS and Linux each split their Node 24 tests into two shards (Linux Node 26 too);
        # only shard 1 also runs pack smoke. One Linux job took 7.6 min at the median (forge-852).
        # Windows splits tests and pack smoke into two jobs: together they reached 1095 s of the
        # 1200 s limit once the spawn-heavy files ran serially (forge-648).
        # Each Windows tests leg now has three time-balanced shards; spawn-heavy files
        # stay serial inside each shard. Pack and the other platforms retain their coverage.
        # Timings: median Windows Node 24 file times over 12 main runs (forge-852); serial files
        # weigh 2.5x because they run alone while parallel files overlap.
        # Assignment spans unit, parallel integration and serial integration together.
        include:
          - { os: ubuntu-latest, node: "24", suite: all, shard: "1/2" }
          - { os: ubuntu-latest, node: "24", suite: tests, shard: "2/2" }
          - { os: ubuntu-latest, node: "26", suite: all, shard: "1/2" }
          - { os: ubuntu-latest, node: "26", suite: tests, shard: "2/2" }
          - { os: macos-latest, node: "24", suite: all, shard: "1/2" }
          - { os: macos-latest, node: "24", suite: tests, shard: "2/2" }
          - { os: windows-latest, node: "24", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "24", suite: pack }
          - { os: windows-latest, node: "26", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "26", suite: pack }
    steps: &verify-steps
      - *windows-storsvc-off
      - *windows-diag-start
      - *start-record
      - name: Keep Windows test temp files on the workspace disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "Windows test temp directory: $env:RUNNER_TEMP" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.os == 'Windows' && 'npm' || '' }}
          cache-dependency-path: bun.lock
      - *lint-runtime
      - *install-lint-runtime
      - *preserve-lint-runtime
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Windows only: installs take 3-10 s there against about 0.2 s on Linux and macOS.
      - id: bun-cache
        if: runner.os == 'Windows'
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - if: matrix.suite != 'pack'
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: cloud
      - name: Provision Handle 5.0 for cleanup attribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "FORGE_HANDLE_EXE=" >> $env:GITHUB_ENV
          "FORGE_HANDLE_UNAVAILABLE=" >> $env:GITHUB_ENV
          try {
            $zip = Join-Path $env:RUNNER_TEMP 'Handle.zip'
            try {
              Invoke-WebRequest 'https://download.sysinternals.com/files/Handle.zip' -OutFile $zip -ErrorAction Stop -TimeoutSec 60 -OperationTimeoutSeconds 60
            } catch { throw "download failed: $($_.Exception.Message)" }
            # SHA-256 source: ScoopInstaller/Sysinternals bucket/handle.json (Handle 5.0).
            if ((Get-FileHash $zip -Algorithm SHA256 -ErrorAction Stop).Hash -ne '279aaf8eccb6f79147f4dcc6ba091fb895c4cb8b199a0dd186a4c76bc519d2cd') { throw 'Handle 5.0 checksum mismatch' }
            $directory = Join-Path $env:RUNNER_TEMP 'handle-5.0'
            Expand-Archive $zip -DestinationPath $directory -ErrorAction Stop
            "FORGE_HANDLE_EXE=$(Join-Path $directory 'handle64.exe')" >> $env:GITHUB_ENV
          } catch {
            $reason = $_.Exception.Message -replace '[\r\n]+', ' '
            "FORGE_HANDLE_UNAVAILABLE=handle unavailable: $reason" >> $env:GITHUB_ENV
            Write-Host "handle unavailable: $reason"
          }
      # The first powershell.exe start and first Add-Type compile on a fresh runner took 2-6 s and
      # sometimes outran a test's own 10-30 s budget (forge-895). Pay that cold start here once.
      # No continue-on-error: if Windows PowerShell 5.1 cannot start, the job fails.
      - name: Warm up Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $script = "Add-Type -TypeDefinition 'public static class ForgeWarm { public static int One() { return 1; } }'; [ForgeWarm]::One()"
          foreach ($pass in 'cold', 'warm') {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $out = & $exe -NoProfile -NonInteractive -Command $script
            if ($LASTEXITCODE -ne 0 -or "$out".Trim() -ne '1') { throw "PowerShell 5.1 $pass warm-up failed: exit $LASTEXITCODE, output '$out'" }
            $line = "PowerShell 5.1 $pass start plus compile: $($timer.ElapsedMilliseconds) ms"
            Write-Host $line
            $line >> $env:GITHUB_STEP_SUMMARY
          }
      - if: matrix.suite != 'pack'
        run: bun run check
      - name: Unit tests
        if: matrix.suite != 'pack'
        run: ${{ matrix.shard && format('bun tools/ci/test-shards.ts test:unit {0} {1}', matrix.shard, matrix.node == '26' && '--node26' || '') || 'bun run test:unit' }} 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - name: Integration tests
        if: matrix.suite != 'pack'
        run: ${{ matrix.shard && format('bun tools/ci/test-shards.ts test:integration {0} {1}', matrix.shard, matrix.node == '26' && '--node26' || '') || 'bun run test:integration' }} 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - if: matrix.suite != 'tests'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packed-package
          path: ${{ runner.temp }}/packed
      - name: Pack smoke
        if: matrix.suite != 'tests'
        env:
          # Node legs split counterfactuals; Bun keeps the full set on Node 24 only.
          STATE_NODE_LEG: ${{ matrix.node }}
          FORGE_PACK_INPUT: ${{ runner.temp }}/packed/forge-workflow.tgz
          FORGE_PACK_EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
          FORGE_PACK_EXPECTED_VERSION: ${{ needs.pack.outputs.version }}
        run: bun run test:pack 2>&1 | tee -a "$RUNNER_TEMP/ci-tests.log"
      - *windows-diag-hold
      - *windows-diag-stop
      - *windows-diag-upload
      - *write-record
      - *upload-record

  verify-nightly:
    name: macOS Node 26 pack
    needs: pack
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: *verify-env
    strategy:
      matrix:
        include:
          - { os: macos-latest, node: "26", suite: pack }
    steps: *verify-steps

  # The one required check. Skipped heavy legs pass only when the change is documentation-only.
  ci-gate:
    name: CI Gate
    if: always() && github.event_name != 'schedule'
    needs:
      [changes, pr-title, structure, static, pack, speed, verify, comment-guard]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES: ${{ needs.changes.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          STRUCTURE: ${{ needs.structure.result }}
          STATIC: ${{ needs.static.result }}
          PACK: ${{ needs.pack.result }}
          SPEED: ${{ needs.speed.result }}
          VERIFY: ${{ needs.verify.result }}
          COMMENT_GUARD: ${{ needs.comment-guard.result }}
          STARTED: ${{ needs.changes.outputs.started }}
        run: |
          if [ -n "$STARTED" ]; then
            wall=$(( $(date +%s) - STARTED ))
            echo "CI wall time: ${wall}s (budget: 12 minutes)"
            echo "CI wall time: ${wall}s" >> "$GITHUB_STEP_SUMMARY"
            if [ "$wall" -gt 720 ]; then
              echo "::warning::CI wall time ${wall}s is over the 12 minute budget; see CODING_STANDARDS.md"
            fi
          fi
          ok=1
          require() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished as '$2'"
              ok=0
            fi
          }
          require "changes" "$CHANGES"
          require "structure" "$STRUCTURE"
          require "static" "$STATIC"
          if [ "$EVENT" = "pull_request" ]; then require "pr-title" "$PR_TITLE"; fi
          if [ "$SCOPE" = "full" ]; then
            require "pack" "$PACK"
            require "speed" "$SPEED"
            require "verify" "$VERIFY"
            require "comment-guard" "$COMMENT_GUARD"
          elif [ "$SCOPE" = "docs" ] && [ "$EVENT" = "pull_request" ]; then
            if [ "$VERIFY" != "skipped" ] || [ "$PACK" != "skipped" ] || [ "$SPEED" != "skipped" ] || [ "$COMMENT_GUARD" != "skipped" ]; then
              echo "::error::verify='$VERIFY', pack='$PACK', speed='$SPEED', comment-guard='$COMMENT_GUARD' on a documentation-only change"
              ok=0
            fi
          else
            echo "::error::unexpected scope '$SCOPE' for '$EVENT'"
            ok=0
          fi
          [ "$ok" = "1" ]
