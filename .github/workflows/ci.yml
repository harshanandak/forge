name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned Bun for check, test, build and pack smoke. `bun lint` and `bun fmt` are merged but not in a
  # stable Bun yet, so the `static` job uses the canary build until a stable release ships them.
  BUN_VERSION: "1.4.3"

defaults:
  run:
    shell: bash

jobs:
  # Heavy legs are skipped when a pull request changes only documentation.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "$changed"
            if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|LICENSE$|.*\.md$|$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must be a conventional commit title (for example 'fix: handle a moved head'); it becomes the squash-merge title and changelog line."
            exit 1
          fi

  # Always runs: guards and formatting also apply to documentation changes.
  structure:
    name: Structure guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:structure

  static:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt --check

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run pack:smoke

  # The one required check. Skipped heavy legs pass only when the change is documentation-only.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, pr-title, structure, static, verify]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          STRUCTURE: ${{ needs.structure.result }}
          STATIC: ${{ needs.static.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          ok=1
          require() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished as '$2'"
              ok=0
            fi
          }
          require "changes" "$CHANGES"
          require "structure" "$STRUCTURE"
          require "static" "$STATIC"
          if [ "$EVENT" = "pull_request" ]; then require "pr-title" "$PR_TITLE"; fi
          if [ "$CODE" = "true" ]; then
            require "verify" "$VERIFY"
          elif [ "$VERIFY" != "skipped" ]; then
            echo "::error::verify finished as '$VERIFY' on a documentation-only change"
            ok=0
          fi
          [ "$ok" = "1" ]
