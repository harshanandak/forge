name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned Bun for check, test, build and pack smoke. `bun fmt` is stable in 1.4.4;
  # `bun lint` still needs the canary build used by the `static` job.
  BUN_VERSION: "1.4.4"

defaults:
  run:
    shell: bash

jobs:
  # Heavy legs are skipped when a pull request changes only documentation.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      started: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "$changed"
            if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|LICENSE$|.*\.md$|$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must be a conventional commit title (for example 'fix: handle a moved head'); it becomes the squash-merge title and changelog line."
            exit 1
          fi

  # Always runs: guards and formatting also apply to documentation changes.
  structure:
    name: Structure guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:structure

  static:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt --check

  pack:
    name: Pack artifact
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Pack and hash once
        run: |
          bun run build
          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")
          mv "$RUNNER_TEMP/$tarball" "$RUNNER_TEMP/forge-workflow.tgz"
          cd "$RUNNER_TEMP"
          sha256sum forge-workflow.tgz | tee forge-workflow.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-package
          path: ${{ runner.temp }}/forge-workflow.tgz*
          if-no-files-found: error
      - name: Packed type resolutions
        run: bun run check:attw "$RUNNER_TEMP/forge-workflow.tgz"

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.suite != 'all' && format(', {0}', matrix.suite) || '' }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: [changes, pack]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FORGE_TEST_SHARD_ARG: ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      FORGE_TEST_TIMINGS_ARG: ${{ matrix.shard && '--timings=test/timings.json' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS hosted runners are capacity-limited and jobs were never picked up (PRs #46, #50).
        # macOS Node 26 runs the shared artifact; Node 24 retains its source tests.
        # Windows splits tests and pack smoke into two jobs: together they reached 1095 s of the
        # 1200 s limit once the spawn-heavy files ran serially (forge-648).
        # Each Windows tests leg now has three time-balanced shards; spawn-heavy files
        # stay serial inside each shard. Pack and the other platforms retain their coverage.
        # Initial timings sum measured test durations per file from Windows Node 24 job
        # 124770514279 (run 41280231270). Refresh on Windows, without a shard, then commit:
        # FORGE_TEST_TIMINGS_ARG=--timings=test/timings.json FORGE_TEST_UPDATE_ARG=--update-timings bun exec 'bun run test:unit && bun run test:integration'
        include:
          - { os: ubuntu-latest, node: "24", suite: all }
          - { os: ubuntu-latest, node: "26", suite: all }
          - { os: macos-latest, node: "24", suite: all }
          - { os: macos-latest, node: "26", suite: pack }
          - { os: windows-latest, node: "24", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "24", suite: pack }
          - { os: windows-latest, node: "26", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "26", suite: pack }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.os == 'Windows' && 'npm' || '' }}
          cache-dependency-path: bun.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Windows only: installs take 3-10 s there against about 0.2 s on Linux and macOS.
      - id: bun-cache
        if: runner.os == 'Windows'
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Start Windows runner trace
        if: runner.os == 'Windows'
        continue-on-error: true
        run: bun tools/ci/windows-trace.ts start
      - if: matrix.suite != 'pack'
        run: bun run check
      - name: Unit tests
        if: matrix.suite != 'pack'
        run: bun run test:unit
      - name: Integration tests
        if: matrix.suite != 'pack'
        run: bun run test:integration
      - if: matrix.suite != 'tests'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packed-package
          path: ${{ runner.temp }}/packed
      - name: Pack smoke
        if: matrix.suite != 'tests'
        env:
          # Node legs split counterfactuals; Bun keeps the full set on Node 24 only.
          STATE_NODE_LEG: ${{ matrix.node }}
          FORGE_PACK_INPUT: ${{ runner.temp }}/packed/forge-workflow.tgz
        run: bun run test:pack
      - name: Stop and summarize Windows runner trace
        id: trace
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          "shard=$('${{ matrix.shard || 'pack' }}'.Replace('/', '-'))" >> $env:GITHUB_OUTPUT
          bun tools/ci/windows-trace.ts stop
          if (Test-Path "$env:RUNNER_TEMP/windows-trace.jsonl.error") { Get-Content "$env:RUNNER_TEMP/windows-trace.jsonl.error" }
      - name: Upload Windows runner trace
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-trace-node-${{ matrix.node }}-${{ matrix.suite }}-${{ steps.trace.outputs.shard || strategy.job-index }}
          path: |
            ${{ runner.temp }}/windows-trace.jsonl
            ${{ runner.temp }}/windows-trace.jsonl.error
          retention-days: 7
          if-no-files-found: warn

  # The one required check. Skipped heavy legs pass only when the change is documentation-only.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, pr-title, structure, static, pack, verify]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          STRUCTURE: ${{ needs.structure.result }}
          STATIC: ${{ needs.static.result }}
          PACK: ${{ needs.pack.result }}
          VERIFY: ${{ needs.verify.result }}
          STARTED: ${{ needs.changes.outputs.started }}
        run: |
          if [ -n "$STARTED" ]; then
            wall=$(( $(date +%s) - STARTED ))
            echo "CI wall time: ${wall}s (budget: about 120s)"
            echo "CI wall time: ${wall}s" >> "$GITHUB_STEP_SUMMARY"
            if [ "$wall" -gt 150 ]; then
              echo "::warning::CI wall time ${wall}s is over the ~2 minute budget; see CODING_STANDARDS.md"
            fi
          fi
          ok=1
          require() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished as '$2'"
              ok=0
            fi
          }
          require "changes" "$CHANGES"
          require "structure" "$STRUCTURE"
          require "static" "$STATIC"
          if [ "$EVENT" = "pull_request" ]; then require "pr-title" "$PR_TITLE"; fi
          if [ "$CODE" = "true" ]; then
            require "pack" "$PACK"
            require "verify" "$VERIFY"
          elif [ "$VERIFY" != "skipped" ] || [ "$PACK" != "skipped" ]; then
            echo "::error::verify='$VERIFY', pack='$PACK' on a documentation-only change"
            ok=0
          fi
          [ "$ok" = "1" ]
