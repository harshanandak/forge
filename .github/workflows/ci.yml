name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned Bun for check, test, build and pack smoke. `bun fmt` is stable in 1.4.4;
  # `bun lint` still needs the canary build used by the `static` job.
  BUN_VERSION: "1.4.4"

defaults:
  run:
    shell: bash

jobs:
  # Heavy legs are skipped when a pull request changes only documentation.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      started: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "$changed"
            if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|LICENSE$|.*\.md$|$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must be a conventional commit title (for example 'fix: handle a moved head'); it becomes the squash-merge title and changelog line."
            exit 1
          fi

  # Always runs: guards and formatting also apply to documentation changes.
  structure:
    name: Structure guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:structure

  static:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt --check

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.suite != 'all' && format(', {0}', matrix.suite) || '' }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FORGE_TEST_SHARD_ARG: ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      FORGE_TEST_TIMINGS_ARG: ${{ matrix.shard && '--timings=test/timings.json' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS hosted runners are capacity-limited and jobs were never picked up (PRs #46, #50).
        # macOS runs Node 24 only; Linux and Windows keep both Node legs.
        # Windows splits tests and pack smoke into two jobs: together they reached 1095 s of the
        # 1200 s limit once the spawn-heavy files ran serially (forge-648).
        # Each Windows tests leg now has three time-balanced shards; spawn-heavy files
        # stay serial inside each shard. Pack and the other platforms retain their coverage.
        # Initial timings sum measured test durations per file from Windows Node 24 job
        # 124770514279 (run 41280231270). Refresh on Windows, without a shard, then commit:
        # FORGE_TEST_TIMINGS_ARG=--timings=test/timings.json FORGE_TEST_UPDATE_ARG=--update-timings bun exec 'bun run test:unit && bun run test:integration'
        include:
          - { os: ubuntu-latest, node: "24", suite: all }
          - { os: ubuntu-latest, node: "26", suite: all }
          - { os: macos-latest, node: "24", suite: all }
          - { os: windows-latest, node: "24", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "24", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "24", suite: pack }
          - { os: windows-latest, node: "26", suite: tests, shard: "1/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "2/3" }
          - { os: windows-latest, node: "26", suite: tests, shard: "3/3" }
          - { os: windows-latest, node: "26", suite: pack }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.os == 'Windows' && 'npm' || '' }}
          cache-dependency-path: bun.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Windows only: installs take 3-10 s there against about 0.2 s on Linux and macOS.
      - id: bun-cache
        if: runner.os == 'Windows'
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - if: matrix.suite != 'pack'
        run: bun run check
      - name: Unit tests
        if: matrix.suite != 'pack'
        run: bun run test:unit
      # TEMPORARY forge-465 probe: remove before merge
      - name: Windows integration timing probe
        if: matrix.suite != 'pack' && runner.os == 'Windows'
        run: |
          node --input-type=commonjs <<'NODE'
          const { spawn, spawnSync } = require('node:child_process');
          const { performance } = require('node:perf_hooks');
          function probe(phase) {
            const started = performance.now();
            const result = spawnSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command', 'exit'], {
              encoding: 'utf8', timeout: 15000,
            });
            console.log('PowerShell cold start: ' + JSON.stringify({
              phase, elapsedMs: Math.round(performance.now() - started),
              status: result.status, signal: result.signal, error: result.error?.message,
            }));
          }
          probe('alone');
          const integration = spawn('bun', ['run', 'test:integration'], {
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          let parallelStarted = false;
          for (const [source, target] of [[integration.stdout, process.stdout], [integration.stderr, process.stderr]]) {
            let pending = '';
            source.on('data', (chunk) => {
              target.write(chunk);
              pending += chunk.toString();
              const lines = pending.split(/\r?\n/);
              pending = lines.pop();
              // The script builds first; its echoed command is not evidence the tests started.
              if (!parallelStarted && lines.some((line) => /^bun test v.* PARALLEL$/.test(line))) {
                parallelStarted = true;
                probe('parallel-integration');
              }
            });
          }
          integration.on('error', (error) => {
            console.error(error);
            process.exitCode = 1;
          });
          integration.on('close', (code) => {
            if (code === 0 && !parallelStarted) {
              console.error('Parallel integration start was not observed');
              process.exitCode = 1;
            } else {
              process.exitCode = code ?? 1;
            }
          });
          NODE
      - name: Integration tests
        if: matrix.suite != 'pack' && runner.os != 'Windows'
        run: bun run test:integration
      # Pack once: every packed journey runs against the smoke's one npm install.
      - name: Pack smoke
        if: matrix.suite != 'tests'
        env:
          # Node legs split counterfactuals; Bun keeps the full set on Node 24 only.
          # macOS has only the Node 24 leg, so its second half runs on Linux and Windows.
          STATE_NODE_LEG: ${{ matrix.node }}
        run: bun run test:pack

  # The one required check. Skipped heavy legs pass only when the change is documentation-only.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, pr-title, structure, static, verify]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          STRUCTURE: ${{ needs.structure.result }}
          STATIC: ${{ needs.static.result }}
          VERIFY: ${{ needs.verify.result }}
          STARTED: ${{ needs.changes.outputs.started }}
        run: |
          if [ -n "$STARTED" ]; then
            wall=$(( $(date +%s) - STARTED ))
            echo "CI wall time: ${wall}s (budget: about 120s)"
            echo "CI wall time: ${wall}s" >> "$GITHUB_STEP_SUMMARY"
            if [ "$wall" -gt 150 ]; then
              echo "::warning::CI wall time ${wall}s is over the ~2 minute budget; see CODING_STANDARDS.md"
            fi
          fi
          ok=1
          require() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished as '$2'"
              ok=0
            fi
          }
          require "changes" "$CHANGES"
          require "structure" "$STRUCTURE"
          require "static" "$STATIC"
          if [ "$EVENT" = "pull_request" ]; then require "pr-title" "$PR_TITLE"; fi
          if [ "$CODE" = "true" ]; then
            require "verify" "$VERIFY"
          elif [ "$VERIFY" != "skipped" ]; then
            echo "::error::verify finished as '$VERIFY' on a documentation-only change"
            ok=0
          fi
          [ "$ok" = "1" ]
