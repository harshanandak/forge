# Generated by `forge release generate-size-workflow` from lib/size-workflow.js.
# Do not edit by hand: change the renderer and regenerate.
name: Package Size Monitor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: size-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  size-check:
    name: Check Package Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm pack only includes bundledDependencies that exist in node_modules.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fetch base-branch baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:scripts/package-size-baseline.json > "$RUNNER_TEMP/base-baseline.json" || rm -f "$RUNNER_TEMP/base-baseline.json"

      - name: Check package size budgets
        run: node scripts/package-size-check.js --previous "$RUNNER_TEMP/base-baseline.json"
