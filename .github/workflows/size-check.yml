# Generated by `forge release generate-size-workflow` from lib/size-workflow.js.
# Do not edit by hand: change the renderer and regenerate.
name: Package Size Monitor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: size-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  size-check:
    name: Check Package Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # On pull_request the checkout is the merge commit; depth 2 brings in its
      # first parent, the exact base revision this run measures against.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # npm pack output depends on the Node/npm version; pin the same Node as
      # npm-publish.yml so a runner image update cannot move the measurement.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm pack only includes bundledDependencies that exist in node_modules.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Read the base baseline from the merge commit parent
        if: github.event_name == 'pull_request'
        # Only a genuinely absent path falls back; any git error fails the step.
        run: |
          set -euo pipefail
          listed="$(git ls-tree --name-only HEAD^1 -- scripts/package-size-baseline.json)"
          if [ -z "$listed" ]; then
            echo "The base revision has no scripts/package-size-baseline.json; checking without base-branch data."
            exit 0
          fi
          git show HEAD^1:scripts/package-size-baseline.json > "$RUNNER_TEMP/base-baseline.json"

      - name: Check package size budgets
        run: node scripts/package-size-check.js --previous "$RUNNER_TEMP/base-baseline.json"
