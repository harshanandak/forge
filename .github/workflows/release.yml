name: Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main CI run containing packed-package (at this dispatch commit for a normal release)
        required: true
        type: string
      readback_only:
        description: Recover a published release. next must already equal the version. The promote approval still follows.
        type: boolean
        default: false
permissions: { contents: read, actions: read }
concurrency:
  group: npm-release
  cancel-in-progress: false
defaults: { run: { shell: bash } }
env:
  TARBALL: ${{ github.workspace }}/packed/forge-workflow.tgz
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.check.outputs.sha256 }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - name: Validate the successful main CI run
        id: source
        env:
          RUN_ID: ${{ inputs.run_id }}
          READBACK_ONLY: ${{ inputs.readback_only }}
          GH_TOKEN: ${{ github.token }}
        run: bun tools/release/source.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          {
            name: packed-package,
            path: packed,
            run-id: "${{ inputs.run_id }}",
            github-token: "${{ github.token }}",
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: npm install --global npm@11.21.0
      - id: check
        env:
          READBACK_ONLY: ${{ inputs.readback_only }}
        run: bun run release:dry-run "$TARBALL"
  publish:
    needs: [verify]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { id-token: write, contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          {
            name: packed-package,
            path: packed,
            run-id: "${{ inputs.run_id }}",
            github-token: "${{ github.token }}",
          }
      - run: npm install --global npm@11.21.0
      - name: Verify approved bytes
        env:
          EXPECTED: ${{ needs.verify.outputs.sha256 }}
        run: |
          bun -e 'import {packInput} from "./tools/pack-smoke/input.ts"; import {hash} from "node:crypto"; import {readFileSync} from "node:fs"; if(hash("sha256",readFileSync(packInput(process.env.TARBALL)))!==process.env.EXPECTED) throw Error("approved sha256 mismatch")'
      - name: Publish to next
        if: inputs.readback_only != true
        run: npm publish "$TARBALL" --provenance --tag next --access public --ignore-scripts
      - name: Record skipped publication
        if: inputs.readback_only == true
        run: 'echo "recovery: publish skipped after byte check" >> "$GITHUB_STEP_SUMMARY"'
  readback:
    needs: [verify, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: ./.github/actions/journey-setup
        with:
          mode: release
          version: ${{ needs.verify.outputs.version }}
          release-run-id: ${{ inputs.run_id }}
          device-root: ${{ runner.temp }}/release-forge
          ecosystem-tools: ${{ runner.temp }}/fixture-tools
          python-packages: ${{ runner.temp }}/fixture-python
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          {
            name: packed-package,
            path: packed,
            run-id: "${{ inputs.run_id }}",
            github-token: "${{ github.token }}",
          }
      - run: bun install --frozen-lockfile
      - name: Bounded registry readback of integrity, next and provenance
        run: |
          node --input-type=module <<'JS'
          import {hash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const start = Date.now(), version = process.env.VERSION;
          const integrity = 'sha512-' + hash('sha512', readFileSync(process.env.TARBALL), 'base64');
          const registry = 'https://registry.npmjs.org';
          const urls = [
            `${registry}/forge-workflow/${encodeURIComponent(version)}`,
            `${registry}/-/package/forge-workflow/dist-tags`,
          ];
          for (let attempt = 0; attempt < 12; attempt++) {
            const signal = AbortSignal.timeout(10000);
            const responses = await Promise.all(urls.map(url => fetch(`${url}?nocache=${crypto.randomUUID()}`, {
              cache: 'no-store', redirect: 'error', signal, headers: {'Cache-Control': 'no-cache'},
            })));
            console.log(`registry readback: ${Date.now()-start}ms, attempt ${attempt+1}/12`);
            for (const r of responses) {
              const cache = r.headers.get('cf-cache-status');
              const age = r.headers.get('age');
              console.log(`registry source: ${r.url} HTTP ${r.status}, CF-Cache-Status=${cache}, Age=${age}`);
              if (r.status !== 200 && r.status !== 404) throw Error(`registry HTTP ${r.status}: ${r.url}`);
              if (Number(age) > 0 || /^(HIT|STALE|UPDATING)$/i.test(cache ?? ''))
                throw Error(`cached registry response: ${r.url}`);
              if (r.status === 200 && (!/^(DYNAMIC|MISS|BYPASS)$/i.test(cache ?? '') || (age !== null && !/^0+$/.test(age))))
                throw Error(`unproven registry response: ${r.url}`);
            }
            const [manifest, tags] = await Promise.all(responses.map(r => r.ok ? r.json() : null));
            if (manifest && (manifest.name !== 'forge-workflow' || manifest.version !== version))
              throw Error('registry package/version mismatch');
            if (manifest && tags?.next === version) {
              if (manifest.dist?.integrity !== integrity) throw Error('registry integrity mismatch');
              if (!manifest.dist?.attestations?.provenance?.predicateType) throw Error('registry provenance missing');
              break;
            }
            if (attempt === 11) throw Error(`registry version/next unavailable after ${Date.now()-start}ms`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          JS
      - name: Cold npm and Bun registry installs and signature verification
        env:
          CI_RUN: ${{ inputs.run_id }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.source_sha }}
          npm_config_cache: ${{ runner.temp }}/release-npm-cache
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/release-bun-cache
        run: |
          mkdir -p "$RUNNER_TEMP/npm-smoke" "$RUNNER_TEMP/bun-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y
          npm install --ignore-scripts "forge-workflow@$VERSION"
          npm audit signatures --json --include-attestations > audit.json
          node "$GITHUB_WORKSPACE/tools/release/readback.mjs" node_modules/forge-workflow/dist/bin/forge.js audit.json package-lock.json
          npx --yes "forge-workflow@$VERSION" --version
          npx --yes "forge-workflow@$VERSION" help
          cd "$RUNNER_TEMP/bun-smoke"
          bun init -y
          bun add --ignore-scripts "forge-workflow@$VERSION"
          node "$GITHUB_WORKSPACE/tools/release/readback.mjs" node_modules/forge-workflow/dist/bin/forge.js "$RUNNER_TEMP/npm-smoke/audit.json" "$RUNNER_TEMP/npm-smoke/package-lock.json"
          bun run forge --version
          bun run forge help
      - name: Required registry journeys
        run: node tools/release/journeys.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/npm-smoke" "$TARBALL"
  promote:
    needs: [verify, readback]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { id-token: write, contents: read }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - run: npm install --global npm@11.21.0
      - name: Promote only after readback and second owner approval
        run: |
          if [[ "$VERSION" == *-* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          read_tag() {
            TAG="$TAG" READ_MODE="$1" bun run - <<'JS'
          const {TAG: tag, VERSION: version, READ_MODE: mode} = process.env;
          const url = `https://registry.npmjs.org/-/package/forge-workflow/dist-tags?nocache=${crypto.randomUUID()}`;
          const response = await fetch(url, {
            cache: 'no-store', redirect: 'error', signal: AbortSignal.timeout(10000), headers: {'Cache-Control': 'no-cache'},
          });
          const cache = response.headers.get('cf-cache-status'), age = response.headers.get('age');
          if (response.status !== 200 || !/^(DYNAMIC|MISS|BYPASS)$/i.test(cache ?? '') || (age !== null && !/^0+$/.test(age)))
            throw Error(`unproven registry response: HTTP ${response.status}, CF-Cache-Status=${cache}, Age=${age}`);
          const tags = await response.json();
          if (!tags || typeof tags !== 'object' || Array.isArray(tags)) throw Error('invalid registry dist-tags');
          const current = tags[tag];
          if (mode === 'before' && current !== undefined && Bun.semver.order(current, version) > 0)
            throw Error(`refusing to downgrade ${tag} from ${current} to ${version}`);
          if (mode === 'after' && current !== version) throw Error(`registry ${tag}: expected ${version}, got ${current}`);
          JS
          }
          read_tag before
          echo "Promoting $VERSION to $TAG"
          npm dist-tag add "forge-workflow@$VERSION" "$TAG"
          read_tag after
