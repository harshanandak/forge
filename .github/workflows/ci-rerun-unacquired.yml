name: Rerun never-acquired CI jobs
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  rerun:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - id: decide
        shell: bash
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" |
            bun tools/ci-unacquired.ts | tee "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      - if: steps.decide.outputs.rerun == 'true'
        shell: bash
        run: gh api --method POST "repos/$GH_REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
