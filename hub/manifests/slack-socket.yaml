display_information:
  name: Forge hub
  description: Project asks and agent messages
features:
  bot_user:
    display_name: Forge
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - im:read
      - im:history
      - users:read
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write.customize
      - reactions:write
      - canvases:write
settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
