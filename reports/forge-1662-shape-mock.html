<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Desk mock</title>
<style>
:root {
  --bg: #f6f6f3;
  --panel: #ffffff;
  --ink: #1d1f23;
  --muted: #6a6f78;
  --line: #e3e3dd;
  --soft: #f0f0ea;
  --accent: #4b5bd6;
  --accent-ink: #ffffff;
  --amber: #c27a00;
  --blue: #2563c9;
  --green: #1f8a4c;
  --red: #c93434;
  --grey: #70757e;
  --amber-bg: #fff3d9;
  --blue-bg: #e3edfd;
  --green-bg: #dff3e6;
  --red-bg: #fbe3e3;
  --grey-bg: #ececea;
  --shadow: 0 8px 30px rgba(20, 20, 40, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14151a;
    --panel: #1d1f26;
    --ink: #ecedf0;
    --muted: #9a9fa9;
    --line: #2d303a;
    --soft: #252832;
    --accent: #7c8bff;
    --accent-ink: #11131a;
    --amber: #f0a830;
    --blue: #6ea2ff;
    --green: #4ccb86;
    --red: #ff7676;
    --grey: #a0a5ae;
    --amber-bg: #3b2d12;
    --blue-bg: #1b2a4a;
    --green-bg: #17352425;
    --red-bg: #3d1c1c;
    --grey-bg: #2a2c33;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1 1 260px; font-size: 15px; }
.crumbs .sep { color: var(--muted); }
.crumbs a { color: var(--muted); }
.crumbs .here { font-weight: 650; color: var(--ink); }
.crumbs .off { color: var(--line); }
.top-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--line); background: var(--soft);
  border-radius: 999px; padding: 6px 14px; font-size: 14px;
  transition: background 150ms, border-color 150ms;
}
.pill:hover { border-color: var(--accent); }
.pill.needs { background: var(--amber-bg); border-color: var(--amber); color: var(--ink); font-weight: 600; }
.pill.trust { font-size: 13px; color: var(--muted); }
/* layout */
main { max-width: 1060px; margin: 0 auto; padding: 24px 20px 90px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 16px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.lead { margin: 0 0 20px; color: var(--muted); }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 20px 100px; }
/* states */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.d-needs { background: var(--amber); }
.d-work { background: var(--blue); }
.d-done { background: var(--green); }
.d-stuck { background: var(--red); }
/* project rows */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: grid; grid-template-columns: 120px 1fr auto; gap: 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; cursor: pointer; text-align: left; width: 100%;
  transition: border-color 150ms, transform 150ms;
}
.row:hover { border-color: var(--accent); transform: translateY(-1px); }
.row .name { font-weight: 650; }
.row .cnt {
  min-width: 30px; text-align: center; border-radius: 999px; padding: 2px 10px; font-weight: 650;
  background: var(--soft); color: var(--muted);
}
.row .cnt.on { background: var(--amber-bg); color: var(--amber); }
.row .txt { display: flex; flex-direction: column; }
.row .nm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
/* blocks */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.block {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px 18px 18px; position: relative;
}
.block.wide { grid-column: 1 / -1; }
.block > header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.menu { position: relative; }
.dots {
  background: none; border: none; border-radius: 8px; padding: 2px 10px; font-size: 18px; color: var(--muted);
  letter-spacing: 1px;
}
.dots:hover { background: var(--soft); }
.menu-pop {
  position: absolute; right: 0; top: 30px; z-index: 5; min-width: 160px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 6px;
}
.menu-pop button {
  display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 10px; border-radius: 8px;
}
.menu-pop button:hover { background: var(--soft); }
.add-tile {
  border: 2px dashed var(--line); border-radius: 16px; background: transparent; color: var(--muted);
  min-height: 90px; font-size: 16px; transition: border-color 150ms, color 150ms;
}
.add-tile:hover { border-color: var(--accent); color: var(--accent); }
/* buttons */
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px;
  transition: background 150ms, border-color 150ms;
}
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.link { background: none; border: none; padding: 0; color: var(--accent); font-size: 14px; }
.link:hover { text-decoration: underline; }
.tag {
  display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; margin-left: 4px;
  background: rgba(255, 255, 255, 0.28); text-transform: uppercase; letter-spacing: 0.04em;
}
.btn:not(.pri) .tag { background: var(--soft); color: var(--muted); }
/* summary, timeline */
.sum p { margin: 0 0 8px; }
.ev { font-size: 12px; margin-left: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tl {
  display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 10px;
  transition: background 200ms;
}
.tl.hl { background: var(--amber-bg); }
.tl.mine { background: var(--soft); }
.badge {
  flex: none; font-size: 11px; border-radius: 999px; padding: 1px 9px; font-weight: 600; white-space: nowrap;
}
.b-claimed { background: var(--grey-bg); color: var(--grey); }
.b-ci { background: var(--blue-bg); color: var(--blue); }
.b-merged { background: var(--green-bg); color: var(--green); }
.b-you { background: var(--accent); color: var(--accent-ink); }
.since { display: flex; align-items: center; gap: 10px; margin: 6px 0; color: var(--muted); font-size: 12px; }
.since::before, .since::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
/* threads, rules, misc lists */
.item {
  display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  margin-bottom: 8px; background: var(--panel); width: 100%; text-align: left;
}
button.item:hover { border-color: var(--accent); }
.item .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip {
  font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 10px; white-space: nowrap;
}
.c-enforced { background: var(--green-bg); color: var(--green); }
.c-held { background: var(--blue-bg); color: var(--blue); }
.c-broken { background: var(--red-bg); color: var(--red); }
.c-not { background: var(--amber-bg); color: var(--amber); }
.rule-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.dry { margin-top: 6px; font-size: 14px; background: var(--soft); border-radius: 8px; padding: 6px 10px; }
/* decision cards */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  animation: pop 180ms ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card .q { font-weight: 600; margin-bottom: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.evl { margin: 6px 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
.ifno { font-size: 13px; color: var(--muted); margin-top: 6px; }
.lockline { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--red); margin-top: 6px; }
.offer {
  background: var(--green-bg); border: 1px solid var(--green); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
  animation: pop 180ms ease;
}
.offer p { margin: 0 0 10px; }
.offer .opts { margin: 0; }
/* panels */
.scrim {
  position: fixed; inset: 0; background: rgba(10, 10, 20, 0.35); z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity 180ms;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.slide {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 50;
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(105%); transition: transform 200ms ease;
  display: flex; flex-direction: column;
}
.slide.on { transform: none; }
.slide > header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
.slide .body { padding: 16px 18px 40px; overflow-y: auto; flex: 1; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.x { background: none; border: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
.x:hover { background: var(--soft); }
.kind-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
.steps { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.step {
  flex: 1 1 90px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 8px;
  font-size: 12px; transition: background 150ms;
}
.step.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step[disabled] { cursor: default; }
.step:not(.on)[disabled] { opacity: 0.55; }
.dr-input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); color: var(--ink); font: inherit; }
/* blob and prompt */
.blob {
  position: fixed; right: 20px; bottom: 20px; z-index: 30; width: 60px; height: 60px; border-radius: 50%;
  border: none; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow);
  display: grid; place-items: center; transition: transform 150ms;
}
.blob:hover { transform: scale(1.06); }
.prompt {
  position: fixed; right: 20px; bottom: 92px; z-index: 35; width: min(400px, calc(100vw - 40px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 14px; opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity 180ms, transform 180ms; max-height: 560px; overflow-y: auto;
}
.prompt.on { opacity: 1; transform: none; pointer-events: auto; }
.looking { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg);
  color: var(--ink); font: inherit;
}
.icon-btn { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; }
.confirm { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
.confirm label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 6px 0; }
.bar { height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); }
.bubble { background: var(--blue-bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
.place { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
.place .r { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.place .lab { width: 86px; color: var(--muted); }
.opt { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.opt.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* toasts */
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100vw - 100px); }
.toast {
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 12px; align-items: center;
  animation: pop 180ms ease; transition: opacity 200ms;
}
.toast.out { opacity: 0; }
.toast button { background: none; border: none; color: var(--bg); text-decoration: underline; padding: 0; }
.thread-lines { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 18px; margin-bottom: 18px; }
.line { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: none; }
.line b { color: var(--muted); font-weight: 600; font-size: 14px; }
.sub { margin: 14px 0 0; color: var(--muted); }
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr auto; }
  .row .st { grid-column: 1 / -1; }
  .topbar { padding: 10px 14px; }
  main { padding: 18px 14px 90px; }
  .line { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>

<div class="topbar">
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <div class="top-right">
    <button class="pill needs" id="needsPill" data-act="open-inbox">Needs you: 0</button>
    <button class="pill trust" id="trustPill" data-act="open-trust">Trust</button>
  </div>
</div>
<main id="app"></main>
<footer>Mock. All data is made up.</footer>
<button class="blob" id="blob" data-act="toggle-prompt" aria-label="Say something">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>

<div class="prompt" id="prompt">

    </button>
    <button class="btn pri" data-act="send">Send</button>
  </div>
</div>
<div class="scrim" id="scrim" data-act="close-all"></div>
<aside class="slide" id="inbox" aria-label="Decision inbox">
  <header><h2 style="margin:0">Decision inbox</h2><button class="x" data-act="close-all" aria-label="Close">&times;</button></header>
  <div class="body">

<aside class="slide" id="trust" aria-label="Trust settings">

  <div class="body" id="trustBody"></div>
</aside>
<aside class="slide" id="drawer" aria-label="Blocks drawer">
  <header><h2 style="margin:0">Blocks drawer</h2><button class="x" data-act="close-all" aria-label="Close">&times;</button></header>
  <div class="body">
    <p class="muted small">Hidden blocks. Show one to put it back on the page.</p>
    <div id="drawerList"></div>
    <h3 style="margin:18px 0 8px">Describe a block you want</h3>
    <input class="dr-input" id="drawerInput" type="text" placeholder="For example: Open questions. Press Enter." autocomplete="off">
  </div>
</aside>
<div class="toasts" id="toasts"></div>

      '<div class="r"><span class="lab">Kind</span>' + chips(["Note", "Rule", "Law"], p.kind, "pl-kind") + "</div>" +
      '<div class="r"><span class="lab">Applies to</span>' + chips(["This thread", "This project", "All projects"], p.scope, "pl-scope") + "</div>" +
      '<div class="r"><span class="lab">Enforced by</span><span>nothing yet</span> <a data-act="pl-enforce">Make it enforced</a></div>' +
      (p.fast ? '<div class="r">This replaces an older note. <button class="opt' + (p.replace ? " on" : "") + '" data-act="pl-replace">' + (p.replace ? "Will replace" : "Replace it") + "</button></div>" : "") +
      '<div class="r"><button class="btn pri small" data-act="pl-accept">Accept</button><button class="btn small" data-act="pl-cancel">Cancel</button></div></div>';
  }
  function clearDyn() { S.answer = null; S.pl = null; }
  function sendPrompt(forced) {
    var inp = $("ppInput");
    var txt = (forced || inp.value).trim();
    if (!txt) return;
    if (S.pend) commitSend();
    clearDyn();
    var low = txt.toLowerCase();
    inp.value = "";
    if (low.indexOf("always") >= 0 || low.indexOf("never") >= 0) {
      S.pl = { text: txt, kind: "Rule", scope: "This project", fast: low.indexOf("fast mode") >= 0, replace: false };
      ppRender();
      return;
    }
    if (/\?\s*$/.test(txt)) {
      S.answer = { q: txt, a: "The last green run was 2 hours ago, on change 44." };
      ppRender();
      return;
    }
    if (S.skip.steer) {
      var e = addEntry(txt, TARGETS[S.tIdx].t);
      render();
      toast("Sent", function () { S.tl.splice(S.tl.indexOf(e), 1); render(); });
      return;
    }
    S.pend = { text: txt, start: Date.now(), skipTick: false };
    ppRender();
    S.pend.timer = setInterval(tick, 100);
  }
  function tick() {
    if (!S.pend) return;
    var el = (Date.now() - S.pend.start) / 1000;
    var left = Math.max(0, 10 - el);
    var f = $("barFill"), s = $("secs");
    if (f) f.style.width = (left * 10) + "%";
    if (s) s.textContent = Math.ceil(left) + "s";
    if (left <= 0) commitSend();
  }
  function commitSend() {
    var p = S.pend;
    if (!p) return;
    clearInterval(p.timer);
    var box = $("skipBox");
    if (box && box.checked) S.skip.steer = true;
    S.pend = null;
    addEntry(p.text, TARGETS[S.tIdx].t);
    ppRender();
    render();
    toast("Sent");
  }
  function undoSend() {
    if (!S.pend) return;
    clearInterval(S.pend.timer);
    $("ppInput").value = S.pend.text;
    S.pend = null;
    ppRender();
    toast("Not sent. Your text is back in the box.");
  }
  /* ---------- click routing ---------- */
  document.addEventListener("click", function (ev) {
    var look = ev.target.closest("[data-look]");
    if (look && !ev.target.closest(".prompt") && !ev.target.closest(".slide")) {
      S.look = look.getAttribute("data-look");
      var l = $("looking");
      if (l) l.textContent = "Looking at: " + S.look;
    }
    var el = ev.target.closest("[data-act]");
    if (!el) {
      if (S.menuOpen && !ev.target.closest(".menu")) { S.menuOpen = null; render(); }
      return;
    }
    var a = el.getAttribute("data-act");
    var d = function (k) { return el.getAttribute("data-" + k); };
    switch (a) {
      case "go-all": go("all"); break;
      case "go-project": go("project"); break;
      case "project": go("project", { project: d("n") }); break;
      case "thread": go("thread", { thread: d("id") }); break;
      case "open-inbox": S.tab = "needs"; render(); openPanel("inbox"); break;
      case "open-trust": render(); openPanel("trust"); break;
      case "open-drawer": render(); openPanel("drawer"); break;
      case "close-all": closeAll(); break;
      case "tab": S.tab = d("t"); render(); break;
      case "ans": answer(d("id"), parseInt(d("i"), 10)); break;
      case "ev": S.evOpen[d("id")] = !S.evOpen[d("id")]; render(); break;
      case "all-defaults": takeAllDefaults(); break;
      case "offer-yes": makeAuto(S.offer); break;
      case "offer-no": S.offerNo[S.offer] = true; S.offer = null; render(); toast("Okay. It will keep asking."); break;
      case "undo-done": undoDone(parseInt(d("i"), 10)); break;
      case "ask-again": askAgain(parseInt(d("i"), 10)); break;
      case "level": setLevel(d("k"), d("l")); break;
      case "menu": S.menuOpen = S.menuOpen === d("b") ? null : d("b"); render(); break;
      case "hide": hideBlock(d("b")); break;
      case "show": showBlock(d("b")); break;
      case "hl": highlight(d("k")); break;
      case "enforce": S.rules[parseInt(d("i"), 10)].s = "enforced"; render(); toast("Done. That rule is now enforced."); break;
      case "dry": S.dry = !S.dry; render(); break;
      case "draft": openPromptWith(d("text")); break;
      case "promote": promote(); break;
      case "toggle-prompt": togglePrompt(); break;
      case "send": sendPrompt(); break;
      case "mic": toast("Voice is not connected in this mock."); break;
      case "change-target": S.tIdx = (S.tIdx + 1) % TARGETS.length; ppRender(); if (S.pend) tick(); break;
      case "undo-send": undoSend(); break;
      case "pl-kind": S.pl.kind = d("v"); ppRender(); break;
      case "pl-scope": S.pl.scope = d("v"); ppRender(); break;
      case "pl-enforce": toast("Enforcing needs a check that can run. None exists for this yet."); break;
      case "pl-replace": S.pl.replace = !S.pl.replace; ppRender(); break;
      case "pl-accept": acceptPlacement(); break;
      case "pl-cancel": S.pl = null; ppRender(); break;
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "ppInput") sendPrompt();
    if (ev.key === "Enter" && ev.target.id === "drawerInput") addCustomBlock();
    if (ev.key === "Escape") { closeAll(); $("prompt").classList.remove("on"); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "skipBox" && S.pend) S.pend.skipTick = ev.target.checked;
  });
  /* ---------- small actions ---------- */
  function hideBlock(id) {
    S.blocks.forEach(function (b) { if (b.id === id) b.hidden = true; });
    S.menuOpen = null;
    render();
    toast("Moved to the drawer.", function () { showBlock(id, true); });
  }
  function showBlock(id, quiet) {
    S.blocks.forEach(function (b) { if (b.id === id) b.hidden = false; });
    render();
    if (!quiet) toast("Block is back on the page.");
  }
  function addCustomBlock() {
    var i = $("drawerInput");
    var v = i.value.trim();
    if (!v) return;
    S.blocks.push({ id: "custom" + S.nextId++, title: v, hidden: false });
    i.value = "";
    render();
    toast("Added a placeholder block: " + v);
  }
  function promote() {
    if (S.researchDone) return;
    S.researchDone = true;
    S.cards.push({ id: "c7", kind: "research", short: "CI parallel run", q: "Run the two CI jobs side by side?", opts: ["Try it for a day", "Not now"], def: 1,
      ev: ["Research says the saving is about 4 minutes.", "The two jobs share one cache and may clash."], no: "expires in 24 hours, nothing happens" });
    render();
    toast("Promoted. It is now a question in Needs you.");
  }
  function acceptPlacement() {
    var p = S.pl;
    if (!p) return;
    var title = (p.kind === "Rule" ? "" : p.kind + ": ") + p.text;
    if (p.fast && p.replace) S.rules = S.rules.filter(function (r) { return r.t !== "Never use fast mode"; });
    S.rules.unshift({ t: title, s: "not" });
    S.pl = null;
    ppRender();
    render();
    toast("Added to In force here as Not enforced.");
  }
  function togglePrompt() {
    var p = $("prompt");
    p.classList.toggle("on");
    if (p.classList.contains("on")) { $("looking").textContent = "Looking at: " + lookText(); setTimeout(function () { $("ppInput").focus(); }, 200); }
  }
  function openPromptWith(text) {
    closeAll();
    $("prompt").classList.add("on");
    $("looking").textContent = "Looking at: " + lookText();
    clearDyn();
    sendPrompt(text);
  }
  render();
})();
</script>
</body>
</html>
