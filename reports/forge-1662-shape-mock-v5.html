<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Desk mock v5</title>
<style>
:root {
  --bg: #faf9f7; --ink: #1c1b1a; --muted: #6b6862; --hair: #e6e3dd; --surface: #ffffff; --soft: #f2efea;
  --accent: #b4540a; --accent-ink: #ffffff; --accent-soft: #fbeee2; --green: #5b7f5a; --red: #b3261e; --grey: #8a8680;
  --band: rgba(28, 27, 26, 0.07);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412; --ink: #ecebe8; --muted: #9a968f; --hair: #2c2a27; --surface: #1d1c1a; --soft: #22201d;
    --accent: #e08a45; --accent-ink: #1a1209; --accent-soft: #2a1d12; --green: #86a884; --red: #e5776f; --grey: #7d7972;
    --band: rgba(236, 235, 232, 0.09);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body { color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--ink); }
[hidden] { display: none !important; }
.mu { color: var(--muted); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.grow { flex: 1 1 auto; }
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }

/* frame */
.app { position: relative; width: 100%; height: 800px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); border: 1px solid var(--hair); border-radius: 8px; }
.topbar { flex: none; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--hair); }
.brand { font-weight: 600; background: none; border: 0; padding: 0; }
.crumb { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb a { color: var(--muted); }
.crumb .cur { color: var(--ink); }
.tbr { font-size: 13px; color: var(--muted); white-space: nowrap; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.tbr:hover { color: var(--ink); }
@media (max-width: 460px) { .crumb { order: 3; flex-basis: 100%; } }
.content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 18px 16px 28px; }
.dock { flex: none; position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--hair); background: var(--bg); }
.dgrp { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 18px; overflow-x: auto; padding: 4px; }
.db { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 2px 0; font-size: 13px; color: var(--muted); white-space: nowrap; }
.db:hover { color: var(--ink); }
.db.on { color: var(--ink); border-bottom-color: var(--ink); }
@media (max-width: 460px) { .dgrp { gap: 13px; } .dock { padding: 8px; } }
.blob { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.blob:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* popovers */
.pop { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; }
.more { left: 12px; bottom: calc(100% + 6px); width: min(340px, calc(100% - 24px)); max-height: 520px; overflow-y: auto; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 4px 2px 8px; border-radius: 6px; font-size: 13px; }
.mrow:hover { background: var(--bg); }
.mrow .open { background: none; border: 0; padding: 5px 0; text-align: left; flex: 1; font-size: 13px; }
.mrow .pin { background: none; border: 0; padding: 4px 6px; font-size: 12px; color: var(--muted); text-decoration: underline; }
.mrow .pin[disabled] { opacity: 0.4; text-decoration: none; cursor: default; }
.mlab { padding: 8px 8px 2px; font-size: 12px; color: var(--muted); }
.msep { border-top: 1px solid var(--hair); margin: 6px 0; }

/* tray */
.tray { flex: none; position: relative; z-index: 1; border-top: 1px solid var(--hair); background: var(--surface); max-height: 330px; overflow-y: auto; }
.tray:empty { display: none; }
.tin { padding: 10px 16px 12px; }
.only { background: var(--accent-soft); border-bottom: 1px solid var(--hair); padding: 10px 16px 11px; border-left: 4px solid var(--accent); }
.only .k { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
.only .q { font-weight: 600; font-size: 14.5px; margin: 1px 0 2px; }
.only.flash { animation: flash 900ms ease 2; }
@keyframes flash { 50% { background: var(--surface); } }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 15px; letter-spacing: 0.08em; background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; padding: 1px 8px; }
.thead { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.tnav { display: flex; gap: 12px; align-items: baseline; margin-left: auto; white-space: nowrap; }
.tcard.slide { animation: slidein 200ms ease; }
@keyframes slidein { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.tq { font-weight: 600; font-size: 14px; line-height: 1.35; margin-bottom: 4px; }
.tmeta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.trayline { padding: 8px 16px; font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }

/* prompt */
.prompt { position: absolute; right: 12px; bottom: 70px; z-index: 35; width: min(400px, calc(100% - 24px)); max-height: 560px; overflow-y: auto; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 14px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 160ms, transform 160ms; }
.prompt.on { opacity: 1; transform: none; pointer-events: auto; }
.looking { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input { flex: 1; min-width: 0; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink); font: inherit; }
.icon-btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
.tries { display: flex; flex-direction: column; gap: 2px; margin: 0 0 10px; }
.try { background: none; border: 0; padding: 3px 0; text-align: left; font-size: 13px; color: var(--muted); }
.try:hover { color: var(--ink); }
.try b { font-weight: 600; color: var(--ink); margin-right: 6px; }
.route { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
.route .said { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 15px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 4px 0; }
.chip { border: 1px solid var(--hair); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.chip:hover { border-color: var(--muted); }
.chip b { font-weight: 600; }
.dest { font-size: 12.5px; color: var(--muted); margin: 6px 0 2px; }
.warnbox { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; margin: 10px 0 4px; }
.vs { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 3px 10px; font-size: 13px; margin: 6px 0; }
.vs .d { color: var(--muted); }
.answerbox { border-left: 2px solid var(--ink); padding: 2px 0 2px 10px; margin: 8px 0; font-size: 13.5px; }

/* toasts */
.toasts { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100% - 24px); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 9px 14px; font-size: 13px; display: flex; gap: 12px; align-items: center; animation: pop 160ms ease; transition: opacity 200ms; }
.toast.out { opacity: 0; }
.toast button { background: none; border: 0; color: var(--bg); text-decoration: underline; padding: 0; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* type */
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.label { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
.sec { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--hair); }
.sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 10px; }
.sh h3 { margin: 0; font-size: 13px; font-weight: 600; }
.tbtn { background: none; border: 0; padding: 0; font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.tbtn.mu { color: var(--muted); }
.tbtn:hover { color: var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 12px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 2px; font-size: 13px; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.prose { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 16.5px; line-height: 1.5; max-width: 62ch; margin: 0 0 10px; }
.prose b { font-weight: 700; }
.btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; padding: 5px 11px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.opts { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.lockline { font-size: 12.5px; color: var(--red); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.d-needs { background: var(--accent); }
.d-work { background: var(--green); }
.d-done { background: var(--grey); }
.d-stuck { background: var(--red); }
.d-idle { background: transparent; border: 1px solid var(--grey); }
.d-pause { background: transparent; border: 2px solid var(--accent); width: 8px; height: 8px; }
.quiet { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

/* home brief */
.hhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 4px; }
.pseg { display: flex; gap: 3px; height: 5px; max-width: 360px; margin: 6px 0 18px; }
.pseg i { flex: 1; background: var(--hair); }
.pseg i.d { background: var(--ink); }
.pseg i.h { background: var(--accent); }
.brief { margin: 0 0 6px; }
.bl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 2px 14px; padding: 9px 0; border-top: 1px solid var(--hair); }
.bl:last-child { border-bottom: 1px solid var(--hair); }
.bl .bk { font-size: 12.5px; color: var(--muted); padding-top: 3px; }
.bl .bk.hot { color: var(--accent); font-weight: 600; }
.bl .bt { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 16.5px; line-height: 1.45; }
.bl .ba { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.bl .bx { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
.bl .bx div { margin: 2px 0; }
@media (max-width: 520px) { .bl { grid-template-columns: minmax(0, 1fr); } }
.awayline { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 13.5px; margin: 12px 0 0; }
.dr { padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.dr .acts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 3px; }
.latest { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 13.5px; }

/* feature rows */
.frow { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.frow:first-child { border-top: 1px solid var(--hair); }
.frow:hover .fnm { text-decoration: underline; }
.frow .dot { transform: translateY(-1px); }
.fnm { font-weight: 600; }
.fsn { font-size: 13px; color: var(--muted); margin-top: 1px; }
.frt { font-size: 12.5px; color: var(--muted); white-space: nowrap; text-align: right; }
@media (max-width: 460px) { .frow { grid-template-columns: 7px minmax(0, 1fr); } .frt { grid-column: 2; text-align: left; white-space: normal; } }

/* before after */
.bars { max-width: 420px; margin: 6px 0 4px; }
.barrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; margin: 5px 0; font-size: 13px; }
.barrow .lb { color: var(--muted); }
.barrow .tr { display: flex; align-items: center; gap: 8px; min-width: 0; }
.barrow .tr i { display: block; height: 10px; background: var(--grey); border-radius: 0 4px 4px 0; }
.barrow.after .tr i { background: var(--ink); }
.ba { border-collapse: collapse; width: 100%; font-size: 14px; }
.ba td { padding: 6px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
.ba td:first-child { width: 70px; color: var(--muted); font-size: 13px; }
.fsec { margin-top: 20px; }
.fsec h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; }
.steps li { margin: 3px 0; }
.ptree, .ptree ul { list-style: none; margin: 0; padding: 0; }
.ptree ul { padding-left: 20px; }
.ptree li { padding: 3px 0; font-size: 13.5px; }
.ptree .dot { margin-right: 8px; transform: translateY(-1px); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; margin: 6px 0; }
.chain .n { border: 1px solid var(--hair); border-radius: 6px; padding: 3px 9px; background: var(--surface); }
.chain .n.me { border-color: var(--ink); font-weight: 600; }
.chain .ar { color: var(--muted); font-size: 12px; }

/* timeline */
.zoom { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 14px; }
.story { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 16.5px; line-height: 1.5; max-width: 62ch; margin: 0 0 16px; }
.te { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 2px 14px; padding: 11px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.te:first-child { border-top: 1px solid var(--hair); }
.te .tt { color: var(--muted); font-size: 13px; padding-top: 2px; }
.te .tt .live { color: var(--green); }
.te .hl { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 16px; font-weight: 700; line-height: 1.35; }
.te .hl.q { font-weight: 400; color: var(--muted); }
.te .tx { font-size: 13.5px; margin-top: 2px; }
.te .mk { display: flex; gap: 8px; align-items: baseline; margin-top: 3px; font-size: 13.5px; }
.te .mk .dot { transform: translateY(-1px); }
.te .src { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.te.you .hl { font-weight: 400; font-style: italic; }
.te .kids { margin-top: 6px; border-left: 1px solid var(--hair); padding-left: 12px; }
.te .kids div { font-size: 13.5px; margin: 4px 0; }
@media (max-width: 460px) { .te { grid-template-columns: minmax(0, 1fr); } }

/* rows, cards, tiles */
.trow { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.trow:first-child { border-top: 1px solid var(--hair); }
.trow:hover .tn { text-decoration: underline; }
.tn { font-weight: 600; margin-right: 8px; }
.tsz { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.sw { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 10px; }
.swb { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 3px; font-size: 14px; color: var(--muted); }
.swb.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.kl { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.mval { font-size: 20px; font-weight: 600; line-height: 1.2; margin-bottom: 2px; }
.stt { font-size: 12.5px; color: var(--muted); }
.stt.out { color: var(--accent); }
.sig { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.sig:first-child { border-top: 1px solid var(--hair); }
.sig .q { font-weight: 600; }
.sig .row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-top: 6px; }
.sig .mean { font-size: 13.5px; flex: 1 1 220px; }
.leg { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.leg i { display: inline-block; width: 14px; height: 8px; background: var(--band); margin-right: 5px; vertical-align: middle; }
.leg s { display: inline-block; width: 14px; height: 2px; background: var(--ink); margin-right: 5px; vertical-align: middle; text-decoration: none; }
.chart { display: flex; align-items: flex-end; gap: 12px; height: 130px; margin: 14px 0 4px; max-width: 420px; }
.bc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; height: 100%; }
.bc .v { font-size: 12.5px; margin-bottom: 3px; }
.bc .b { width: 100%; max-width: 40px; background: var(--grey); border-radius: 4px 4px 0 0; }
.bc.now .b { background: var(--ink); }
.days { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 18px; max-width: 420px; }
.days span { flex: 1; text-align: center; }
.rrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.cols3 h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.ic { padding: 6px 0; border-bottom: 1px solid var(--hair); font-size: 13px; cursor: pointer; }
.ic:hover { text-decoration: underline; }
.stack { display: flex; gap: 2px; height: 10px; margin: 8px 0 6px; max-width: 420px; }
.stack i { display: block; height: 100%; }

/* team sync visual */
.opt3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0 10px; }
@media (max-width: 560px) { .opt3 { grid-template-columns: minmax(0, 1fr); } }
.ov { border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-size: 12.5px; }
.ov.def { border-color: var(--accent); }
.ov b { font-size: 13px; }
.ov svg { display: block; width: 100%; max-width: 200px; height: auto; margin: 4px 0; }
.ov .lose { color: var(--muted); }
.mini { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0 10px; }
.mini td, .mini th { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--hair); text-align: left; vertical-align: top; font-weight: 400; }
.mini th { color: var(--muted); }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 45; background: var(--bg); border-left: 1px solid var(--hair); box-shadow: var(--shadow); transform: translateX(105%); transition: transform 180ms ease; display: flex; flex-direction: column; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
.drawer > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.drawer > header h2 { margin: 0; font-size: 14px; font-weight: 600; }
.drawer .body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.drawer footer { padding: 10px 16px; border-top: 1px solid var(--hair); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; }
.msg { margin-bottom: 12px; font-size: 13.5px; }
.msg.me { border-left: 2px solid var(--ink); padding-left: 10px; }
.msg .who2 { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.gi { padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.gi .w { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
.gi.ok { color: var(--muted); }

/* fixed vs filled */
.lay [data-slot] { position: relative; outline: 1px dashed var(--grey); outline-offset: 4px; margin-top: 22px; }
.lay [data-slot]::before { content: attr(data-slot); position: absolute; top: -21px; left: 0; font: 11.5px system-ui, sans-serif; color: var(--muted); white-space: nowrap; }
.lay [data-slot^="Filled"] { outline-color: var(--accent); }
.lay [data-slot^="Filled"]::before { color: var(--accent); }

    "pp-scope": function () { S.pp.scope = SCOPES[(SCOPES.indexOf(S.pp.scope) + 1) % SCOPES.length]; renderPrompt(); },
    "pp-res": function (el) { S.pp.res = el.dataset.v; renderPrompt(); },
    "pp-mk": function (el) { S.pp.mk = el.dataset.v === "1"; renderPrompt(); },
    "pp-talk": function () { var t = S.pp.text.replace(/^idea:\s*/i, ""); closePrompt(); S.drawer = { kind: "chat", text: t, idea: null, step: 0 }; renderDrawer(); },
    "pp-cancel": function () { $("ppInput").value = S.pp.text; S.pp = null; renderPrompt(); $("ppInput").focus(); },
    send: function () { sendRouted(); },
    leave: function () { closePrompt(); S.drawer = { kind: "leave", ok: {}, len: "night" }; renderDrawer(); },
    "leave-len": function (el) { S.drawer.len = el.dataset.v; renderDrawer(); },
    "leave-signin": function () { S.drawer = null; renderDrawer(); A["goto-signin"](); },
    "leave-c1": function () { var c = card("c1"); if (c) answer("c1", c.def); S.drawer.ok.g2 = "Settled: C."; renderDrawer(); },
    "leave-small": function () {
      ["c2", "c3"].forEach(function (id) { var c = card(id); if (c) { S.cards.splice(S.cards.indexOf(c), 1); S.done.unshift({ id: "dl" + id, time: NOW, kind: c.kind, what: c.opts[c.def] + (c.short ? ": " + c.short : ""), why: "You said defaults are fine, before leaving." }); } });
      S.drawer.ok.g3 = "Settled on defaults. Listed in Done for you."; render();
    },
    "leave-go": function () { S.drawer = null; render(); toast("See you. Work keeps going on defaults; your brief will be ready when you are back."); }
  };
  function ideaToPlan(i) {
    var at = i.id ? S.ideas.indexOf(i) : -1;
    if (at >= 0) S.ideas.splice(at, 1);
    var f = { id: "fn" + (++logN), name: i.t.replace(/[.?!]+$/, "").split(/\s+/).slice(0, 5).join(" "), s: "idle", when: "not started", sent: i.t, gives: i.t,
      ba: { unit: "", bl: "An idea", al: "Not built yet", what: "Today" }, proof: [], unmeasured: "Not measured yet. It has not started.",
      steps: ["Agree what it should give you.", "Build it.", "Test it."], parts: [{ n: "First part", s: "idle" }], deps: [], thr: [], ch: "None yet", size: 1, tl: [] };
    FEATS.push(f); S.sizes[f.id] = 1;
    render();
    toast("Added to the plan as not started. The release date does not move.", function () { FEATS.splice(FEATS.indexOf(f), 1); if (at >= 0) S.ideas.splice(at, 0, i); render(); });
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el || !$("appBox").contains(el)) {
      if (S.moreOpen && !e.target.closest(".more")) { S.moreOpen = false; renderDock(); }
      return;
    }
    var act = el.dataset.act;
    if (S.moreOpen && act !== "more" && act !== "pin" && !el.closest(".more")) { S.moreOpen = false; }
    if (A[act]) { e.stopPropagation(); A[act](el); }
    if (act !== "more" && act !== "pin" && !el.closest(".more") && S.moreOpen) { S.moreOpen = false; renderDock(); }
  });
  $("ppInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); readInput(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if ($("prompt").classList.contains("on")) closePrompt();
    else if (S.drawer) { S.drawer = null; renderDrawer(); }
    else if (S.moreOpen) { S.moreOpen = false; renderDock(); }
  });
  render();
})();
</script>
