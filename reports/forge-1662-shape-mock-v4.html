<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Desk mock v4</title>
<style>
:root {
  --bg: #faf9f7; --ink: #1c1b1a; --muted: #6b6862; --hair: #e6e3dd; --surface: #ffffff;
  --accent: #b4540a; --accent-ink: #ffffff; --green: #5b7f5a; --red: #b3261e; --grey: #8a8680;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412; --ink: #ecebe8; --muted: #9a968f; --hair: #2c2a27; --surface: #1d1c1a;
    --accent: #e08a45; --accent-ink: #1a1209; --green: #86a884; --red: #e5776f; --grey: #7d7972;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body { color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--muted); cursor: pointer; text-decoration: none; }
a:hover { color: var(--ink); text-decoration: underline; }
[hidden] { display: none !important; }
.mu { color: var(--muted); }
.sm { font-size: 13px; }
.grow { flex: 1 1 auto; }
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
.ul { text-decoration: underline; }

/* frame */
.app { position: relative; width: 100%; height: 800px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); border: 1px solid var(--hair); border-radius: 8px; }
.topbar { flex: none; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--hair); }
.brand { font-weight: 600; background: none; border: 0; padding: 0; }
.crumb { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb a { color: var(--muted); }
.crumb .cur { color: var(--ink); }
.tbr { font: inherit; font-size: 13px; color: var(--muted); white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; }
.tbr:hover { color: var(--ink); text-decoration: underline; }
@media (max-width: 460px) { .crumb { order: 3; flex-basis: 100%; } }
.content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 18px 16px 28px; }
.dock { flex: none; position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--hair); background: var(--bg); }
.dock.bare { position: absolute; right: 12px; bottom: 12px; left: auto; padding: 0; border: 0; background: transparent; }
.dgrp { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px; overflow-x: auto; padding: 4px 4px; }
.db { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 2px 0; font-size: 13px; color: var(--muted); white-space: nowrap; }
.db:hover { color: var(--ink); }
.db.on { color: var(--ink); border-bottom-color: var(--ink); }
@media (max-width: 460px) { .dgrp { gap: 12px; } .dock { padding: 8px 8px; } }
.blob { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }

/* popovers */
.pop { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; }
.more { left: 12px; bottom: calc(100% + 6px); width: min(320px, calc(100% - 24px)); }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 4px 3px 8px; border-radius: 6px; font-size: 13px; }
.mrow:hover { background: var(--bg); }
.mrow .open { background: none; border: 0; padding: 4px 0; text-align: left; flex: 1; font-size: 13px; }
.mrow .pin { background: none; border: 0; padding: 4px 6px; font-size: 12px; color: var(--muted); text-decoration: underline; }
.mrow .pin[disabled] { opacity: 0.35; text-decoration: none; cursor: default; }
.mlab { padding: 6px 8px 2px; font-size: 12px; color: var(--muted); }
.tray { flex: none; position: relative; z-index: 1; border-top: 1px solid var(--hair); background: var(--surface); padding: 10px 16px; max-height: 360px; overflow-y: auto; }
.tray:empty { display: none; }
.tray.empty { background: var(--bg); padding: 6px 16px; border-top: 0; }
.tcard { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 62px; }
.tcard.slide { animation: slidein 200ms ease; }
@keyframes slidein { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.tmain { flex: 1 1 260px; min-width: 0; }
.tmain .q { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.tmain .kl { margin-bottom: 2px; }
.topts { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.tnav { display: flex; gap: 10px; align-items: center; margin-left: auto; font-size: 13px; white-space: nowrap; }
.thead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-start; margin-bottom: 8px; }
.prompt { position: absolute; right: 12px; bottom: 70px; z-index: 35; width: min(380px, calc(100% - 24px)); max-height: 520px; overflow-y: auto; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 14px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 160ms, transform 160ms; }
.prompt.on { opacity: 1; transform: none; pointer-events: auto; }
.toasts { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100% - 24px); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 9px 14px; font-size: 13px; display: flex; gap: 12px; align-items: center; animation: pop 160ms ease; transition: opacity 200ms; }
.toast.out { opacity: 0; }
.toast button { background: none; border: 0; color: var(--bg); text-decoration: underline; padding: 0; }

/* text pieces */
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2.bt { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
.lede { font-size: 19px; line-height: 1.4; max-width: 48ch; margin: 0 0 20px; }
.lab { color: var(--muted); font-size: 12.5px; margin-right: 8px; }
.label { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.sec { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--hair); }
.sec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
.sh h3 { margin: 0; font-size: 13px; font-weight: 600; }
.tbtn { background: none; border: 0; padding: 0; font-size: 13px; color: var(--ink); }
.tbtn:hover { text-decoration: underline; }
.tbtn.mu { color: var(--muted); }
.tbtn.u { text-decoration: underline; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 14px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 2px; font-size: 13px; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.prose { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 16.5px; line-height: 1.55; max-width: 62ch; margin: 0 0 10px; }
.prose.lines { font-size: 15.5px; margin: 0 0 6px; }
.prose b { font-weight: 700; }

/* state */
.st { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.st.s-needs { color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.d-needs { background: var(--accent); }
.d-work { background: var(--green); }
.d-done { background: var(--grey); }
.d-stuck { background: var(--red); }
.d-idle { background: transparent; border: 1px solid var(--grey); }

/* switch */
.sw { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 6px; }
.swb { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 3px; font-size: 14px; color: var(--muted); }
.swb.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.quiet { margin: 16px 0 0; font-size: 13px; color: var(--muted); }

/* rows */
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--hair); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.pr:first-child { border-top: 1px solid var(--hair); }
.pr:hover .pn { text-decoration: underline; }
.pn { font-weight: 600; font-size: 16px; margin-right: 8px; }
.pr .cn { color: var(--accent); font-size: 13px; white-space: nowrap; }
.pr .top { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.trow { display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.trow:first-child { border-top: 1px solid var(--hair); }
.trow:hover .tn { text-decoration: underline; }
.trow .dot { transform: translateY(-1px); }
.tn { font-weight: 600; margin-right: 8px; }
.tsz { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.rrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.wrow { padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.fi { padding: 8px 0; border-bottom: 1px solid var(--hair); }
.fl { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.stw { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.stw.s-broken { color: var(--red); }
.why { font-size: 13px; color: var(--muted); margin-top: 2px; }
.fi .acts { margin-top: 3px; display: flex; gap: 14px; }
.fi .acts .tbtn, .dr .acts .tbtn { text-decoration: underline; }
.dry { margin-top: 4px; font-size: 13px; color: var(--muted); }

/* plan strip */
.plan { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; margin: 0 0 16px; align-items: center; }
.pi { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.grid.one { grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; animation: pop 160ms ease; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.kl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.card .q { font-weight: 600; margin-bottom: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; }
.btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; padding: 5px 11px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.lockline { font-size: 12.5px; color: var(--red); margin-top: 8px; }
.ask { margin: 4px 0 6px; }
.tb { border-collapse: collapse; width: 100%; font-size: 13px; margin: 2px 0 10px; }
.tb td { padding: 5px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
.tb td:first-child { color: var(--muted); width: 42%; padding-right: 10px; }
.ck { list-style: none; margin: 2px 0 10px; padding: 0; font-size: 13px; }
.ck li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
.ck li.left { color: var(--muted); }
.ck .dot { transform: translateY(-1px); }
.pbar { height: 6px; background: var(--hair); margin: 4px 0 10px; display: flex; }
.pbar i { display: block; height: 100%; background: var(--ink); }
.offer { border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.offer p { margin: 0 0 10px; }
.dr { padding: 9px 0; border-bottom: 1px solid var(--hair); }
.dr .acts { display: flex; gap: 16px; margin-top: 4px; }
.kind-row { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.steps3 { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.step { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 2px; font-size: 13px; color: var(--muted); }
.step.on { color: var(--ink); border-bottom-color: var(--ink); }
.step[disabled] { cursor: default; }
.step:not(.on)[disabled] { opacity: 0.5; }

/* timeline */
.te { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; gap: 2px 14px; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.te:first-child { border-top: 1px solid var(--hair); }
.te .tt { color: var(--muted); font-size: 13px; }
.te .tt .live { color: var(--green); margin-left: 4px; }
.te .tline { font-size: 13.5px; margin-bottom: 3px; }
.te .tc { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.te .tx { grid-column: 2 / -1; padding: 4px 0 2px; }
.te.sub { border-bottom: 0; border-top: 1px solid var(--hair); padding: 8px 0; cursor: pointer; grid-template-columns: 110px minmax(0, 1fr) auto; }
.te.sub:first-child { border-top: 0; }
.tx .who { font-size: 13px; color: var(--muted); }
@media (max-width: 520px) {
  .te, .te.sub { grid-template-columns: minmax(0, 1fr); }
  .te .tx { grid-column: 1; }
}

/* board, chart */
.stack { display: flex; height: 10px; margin: 10px 0 6px; }
.stack i { display: block; height: 100%; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.cols3 h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.ic { padding: 6px 0; border-bottom: 1px solid var(--hair); font-size: 13px; }
.chart { display: flex; align-items: flex-end; gap: 12px; height: 140px; margin: 16px 0 6px; }
.bc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
.bc .v { font-size: 12.5px; margin-bottom: 3px; }
.bc .b { width: 100%; max-width: 44px; background: var(--ink); }
.days { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 20px; }
.days span { flex: 1; text-align: center; }

/* features and plan */
.hrow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 8px; }
.hrow b { font-weight: 600; font-size: 16px; }
.pseg { display: flex; gap: 3px; height: 6px; max-width: 420px; margin: 0 0 18px; }
.pseg i { flex: 1; background: var(--hair); }
.pseg i.d { background: var(--ink); }
.pseg i.h { background: var(--grey); opacity: 0.6; }
.frow { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.frow:first-child { border-top: 1px solid var(--hair); }
.frow:hover .fnm { text-decoration: underline; }
.frow .dot { transform: translateY(-1px); }
.fnm { font-weight: 600; }
.fsn { font-size: 13px; color: var(--muted); margin-top: 1px; }
.frt { font-size: 12.5px; color: var(--muted); white-space: nowrap; text-align: right; }
@media (max-width: 460px) { .frow { grid-template-columns: 7px minmax(0, 1fr); } .frt { grid-column: 2; text-align: left; white-space: normal; } }
.ptree, .ptree ul { list-style: none; margin: 0; padding: 0; }
.ptree ul { padding-left: 20px; }
.ptree li { padding: 3px 0; font-size: 13.5px; }
.ptree li > span.n { margin-left: 8px; }
.ptree .dot { margin-right: 8px; transform: translateY(-1px); }
.ba { border-collapse: collapse; width: 100%; font-size: 14px; }
.ba td { padding: 6px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
.ba td:first-child { width: 70px; color: var(--muted); font-size: 13px; }
.fsec { margin-top: 22px; }
.fsec h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; }
.hoodln { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cols3b { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .cols3b { grid-template-columns: minmax(0, 1fr); } }
.cols3b h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
/* analytics, drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 45; background: var(--bg); border-left: 1px solid var(--hair); box-shadow: var(--shadow); transform: translateX(105%); transition: transform 180ms ease; display: flex; flex-direction: column; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
.drawer > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.drawer > header h2 { margin: 0; font-size: 14px; font-weight: 600; }
.drawer .body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.drawer footer { padding: 10px 16px; border-top: 1px solid var(--hair); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; }
.msg { margin-bottom: 12px; font-size: 13.5px; }
.msg.me { border-left: 2px solid var(--ink); padding-left: 10px; }
.msg .who2 { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.stt { font-size: 12.5px; color: var(--muted); }
.stt.out { color: var(--accent); }
.mval { font-size: 20px; font-weight: 600; line-height: 1.2; margin-bottom: 2px; }
.sugg { margin-top: 24px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
/* prompt internals */
.looking { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input { flex: 1; min-width: 0; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink); font: inherit; }
.icon-btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; }
.confirm { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
.confirm label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 6px 0; }
.bar { height: 3px; background: var(--hair); overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; width: 100%; background: var(--ink); }
.bubble { border-left: 2px solid var(--ink); padding: 2px 0 2px 10px; margin-bottom: 10px; font-size: 13.5px; }
.place { border: 1px solid var(--hair); border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13.5px; }
.place .r { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.place .lab { width: 84px; }
.opt { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 1px; font-size: 13px; color: var(--muted); }
.opt.on { color: var(--ink); border-bottom-color: var(--ink); }
</style>
</head>
<body>
<div class="app" id="appBox">
  <header class="topbar">
    <button class="brand" data-act="go-all">Forge Desk</button>
    <span class="crumb" id="crumb"></span>
    <span class="grow"></span>
    <button class="tbr" id="tbr" data-act="block" data-b="decisions"></button>
  </header>
  <div class="content" id="content"></div>
  <div class="tray" id="tray"></div>
  <div class="dock" id="dock"></div>
  <div class="prompt" id="prompt">
    <div class="looking" id="looking"></div>
    <div id="ppDyn"></div>
    <div class="inrow">
      <input id="ppInput" type="text" placeholder="Say anything. Press Enter to send." autocomplete="off">
      <button class="icon-btn" data-act="mic" aria-label="Voice, not connected in this mock">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="btn dark" data-act="send">Send</button>
    </div>
  </div>
  <aside class="drawer" id="chat" aria-label="Side chat"></aside>
  <div class="toasts" id="toasts"></div>
</div>
<script>
(function () {
  "use strict";
  /* ---------- vocabulary ---------- */
  var ST = { needs: "Needs me", work: "Running", done: "Closed", stuck: "Stuck" };
  var KINDS = {
    branch: { name: "Bring a feature up to date", irr: false },
    review: { name: "Start another review round", irr: false },
    deps: { name: "Update a tool version", irr: false },
    flaky: { name: "Re-run a flaky CI job", irr: false },
    publish: { name: "Publish the release", irr: true },

      case "size": S.sizes[d("id")] = S.sizes[d("id")] % 3 + 1; render(); break;
      case "asig-fix": S.tid = "newt"; openPrompt(); $("ppInput").value = "Find why the upload test keeps failing and fix the cause."; break;
      case "asig-why": go("feature", { feature: "f6" }); break;
      case "asig-ans": go("project", { block: "decisions" }); break;
      case "new-idea": S.tid = S.thread; S.forceIdea = true; S.ctxLine = "From: " + thr(S.thread).name + ". The thread keeps working."; openPrompt(); break;
      case "idea-park": var t1 = S.idea.text; S.idea = null; S.ctxLine = null; ppRender(); parkIdea(t1); break;
      case "idea-plan": addFeatureFromIdea(mkIdea(S.idea.text)); S.idea = null; S.ctxLine = null; ppRender(); render(); toast("Added to the plan as not started."); break;
      case "idea-talkp": var i2 = mkIdea(S.idea.text); S.idea = null; S.ctxLine = null; ppRender(); openChat(i2, false); break;
      case "idea-send":
        var t3 = S.idea.text; S.idea = null; S.ctxLine = null;
        if (S.tid === "idea") S.tid = S.prevTid || "lead";
        S.pend = { text: t3, start: Date.now(), skipTick: false }; ppRender(); S.pend.timer = setInterval(tick, 100); break;
      case "idea-talk": openChat(S.ideas.filter(function (i) { return i.id === d("id"); })[0], true); break;
      case "idea-feat": addFeatureFromIdea(S.ideas.filter(function (i) { return i.id === d("id"); })[0]); removeIdea(d("id")); render(); toast("Added to the plan as not started."); break;
      case "idea-drop": removeIdea(d("id")); render(); toast("Dropped."); break;
      case "chat-close": S.chat = null; render(); break;
      case "chat-pick": S.chat.pick = d("v"); S.chat.step = 1; render(); break;
      case "chat-plan": chatDone("plan"); break;
      case "chat-keep": chatDone("keep"); break;
      case "chat-drop": chatDone("drop"); break;
      case "block": go("project", { block: d("b") }); break;
      case "more": S.more = !S.more; render(); break;
      case "pin": if (S.pinned.length < 4) { S.pinned.push(d("b")); } render(); break;
      case "unpin": S.pinned.splice(S.pinned.indexOf(d("b")), 1); render(); break;
      case "sw": S.sw[d("k")] = d("v"); render(); break;
      case "stab":
        var s = d("s"), t = d("t");
        if (s === "decisions") S.dtab = t; else if (s === "rules") S.ftab = t; else if (s === "research") S.rtab = t; else if (s === "watch") S.wtab = t; else if (s === "feat") S.ftabF = t; else if (s === "an") S.atab = t; else if (s === "plan") S.ptab = t;
        render(); break;
      case "sum-more": S.sumMore = !S.sumMore; render(); break;
      case "tmore": S.tmore[S.thread] = !S.tmore[S.thread]; render(); break;
      case "tl": S.tlOpen[d("id")] = !S.tlOpen[d("id")]; render(); break;
      case "ans": answer(d("id"), parseInt(d("i"), 10)); break;
      case "accept": answer(d("id"), cardById(d("id")).def); break;
      case "reject": answer(d("id"), -1); break;
      case "tprev": trayNav(-1); break;
      case "tnext": trayNav(1); break;
      case "tmore": trayMore(d("id")); break;
      case "tclose": delete S.texp[d("id")]; render(); break;
      case "more-detail": moreDetail(d("id")); break;
      case "less": delete S.exp[d("id")]; render(); break;
      case "offer-yes": makeAuto(S.offer); break;
      case "offer-no": S.offerNo[S.offer] = true; S.offer = null; render(); toast("Okay. It will keep asking."); break;
      case "undo-done": undoDone(parseInt(d("i"), 10)); break;
      case "ask-again": askAgain(parseInt(d("i"), 10)); break;
      case "level": setLevel(d("k"), d("l")); break;
      case "enforce": S.lists[d("l")][parseInt(d("i"), 10)].s = "enforced"; render(); toast("Done. That note is now enforced."); break;
      case "dry": S.dry = !S.dry; render(); break;
      case "promote": promote(); break;
      case "toggle-prompt": if ($("prompt").classList.contains("on")) { $("prompt").classList.remove("on"); S.forceIdea = false; S.ctxLine = null; ppRender(); } else openPrompt(); break;
      case "send": sendPrompt(); break;
      case "mic": toast("Voice is not connected in this mock."); break;
      case "change-target":
        var ids = THREADS.filter(function (x) { return x.s !== "done"; }).map(function (x) { return x.id; });
        ids.push("idea");
        if (S.tid !== "idea") S.prevTid = S.tid;
        S.tid = ids[(ids.indexOf(S.tid) + 1) % ids.length];
        ppRender(); render(); if (S.pend) tick(); break;
      case "undo-send": undoSend(); break;
      case "pl-kind": S.pl.kind = d("v"); ppRender(); break;
      case "pl-scope": S.pl.scope = d("v"); ppRender(); break;
      case "pl-enforce": toast("Enforcing needs a check that can run. None exists for this yet."); break;
      case "pl-replace": S.pl.replace = !S.pl.replace; ppRender(); break;
      case "pl-accept": acceptPlacement(); break;
      case "pl-cancel": S.pl = null; ppRender(); break;
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "ppInput") sendPrompt();
    if (ev.key === "Escape") { S.more = false; S.chat = null; S.forceIdea = false; S.ctxLine = null; ppRender(); render(); $("prompt").classList.remove("on"); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "skipBox" && S.pend) S.pend.skipTick = ev.target.checked;
  });
  render();
})();
</script>
</body>
</html>
