<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Desk mock v2</title>
<style>
:root {
  --bg: #faf9f7;
  --ink: #1c1b1a;
  --muted: #6b6862;
  --hair: #e6e3dd;
  --surface: #ffffff;
  --accent: #b4540a;
  --accent-ink: #ffffff;
  --green: #5b7f5a;
  --red: #b3261e;
  --grey: #8a8680;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412;
    --ink: #ecebe8;
    --muted: #9a968f;
    --hair: #2c2a27;
    --surface: #1d1c1a;
    --accent: #e08a45;
    --accent-ink: #1a1209;
    --green: #86a884;
    --red: #e5776f;
    --grey: #7d7972;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--muted); cursor: pointer; text-decoration: none; }
a:hover { color: var(--ink); text-decoration: underline; }
[hidden] { display: none !important; }
.mu { color: var(--muted); }
.sm { font-size: 13px; }
.grow { flex: 1 1 auto; }
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 22px;
  padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--hair);
}
.brand { font-weight: 600; background: none; border: 0; padding: 0; }
.tbtn { background: none; border: 0; padding: 0; font-size: 13px; color: var(--ink); }
.tbtn:hover { text-decoration: underline; }
.tbtn.mu { color: var(--muted); }
.tbtn.acc { color: var(--accent); }
main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 110px; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 20px 100px; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.h1row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.h1l { display: flex; align-items: center; gap: 14px; }
.hbtns { display: flex; gap: 18px; align-items: center; }
.lede { font-size: 20px; line-height: 1.4; max-width: 48ch; margin: 14px 0 8px; }
.meta { margin: 0 0 36px; color: var(--muted); font-size: 13px; }
.menuwrap { position: relative; }
.pop {
  position: absolute; right: 0; top: 26px; z-index: 10; min-width: 180px; background: var(--surface);
  border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 6px;
}
.pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.pop button:hover { background: var(--bg); }
.pop .mu { padding: 6px 8px; font-size: 13px; }
/* state */
.st { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; white-space: nowrap; }
.st.s-needs { color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.d-needs { background: var(--accent); }
.d-work { background: var(--green); }
.d-done { background: var(--grey); }
.d-stuck { background: var(--red); }
/* columns and sections */
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; }
@media (min-width: 700px) { .cols { grid-template-columns: minmax(0, 62fr) minmax(0, 38fr); gap: 32px; } }
.col > .sec { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--hair); }
.col > .sec:first-child { margin-top: 0; }
.sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 14px; }
.sh h3 { margin: 0; font-size: 13px; font-weight: 600; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 2px; font-size: 13px; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab .n { color: var(--muted); }
.dens { display: inline-flex; gap: 12px; }
.dens button { background: none; border: 0; padding: 0; font-size: 13px; color: var(--muted); }
.dens button.on { color: var(--ink); font-weight: 600; }
.sec.edit { outline: 1px dashed var(--muted); outline-offset: 8px; }
.ctl { display: inline-flex; gap: 10px; }
.ctl button { background: none; border: 0; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }
.ctl button[disabled] { opacity: 0.35; cursor: default; text-decoration: none; }
.addslot { margin-top: 32px; padding: 12px; border: 1px dashed var(--hair); border-radius: 8px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
/* brief */
.prose { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 16.5px; line-height: 1.55; max-width: 62ch; margin: 0 0 12px; }
.prose b { font-weight: 700; }
.src { font-family: system-ui, sans-serif; font-size: 12.5px; color: var(--muted); margin-left: 4px; }
.src a { color: var(--muted); }
.claim { font-family: system-ui, sans-serif; font-size: 12.5px; color: var(--muted); margin-left: 4px; }
.notcov { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
.evg { margin: 0 0 14px; }
.evg > b { font-size: 13px; }
.evr { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; font-size: 13.5px; padding: 2px 0; }
.evr time { color: var(--muted); }
/* work */
.goal { margin-bottom: 20px; }
.gl { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; margin-bottom: 4px; }
.gl b { font-weight: 600; }
.gl .steps { font-size: 13px; color: var(--muted); }
.gl .steps .dn { color: var(--ink); }
.trow { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.trow:hover .tl1 b { text-decoration: underline; }
.trow .dot { transform: translateY(-1px); }
.tl1 b { font-weight: 600; margin-right: 6px; }
.why { font-size: 13px; color: var(--muted); margin-top: 2px; }
.why .tbtn { margin-left: 8px; color: var(--ink); text-decoration: underline; }
.tm { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.resline { display: flex; gap: 14px; align-items: baseline; }
.rrow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
/* cards */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; animation: pop 160ms ease; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.card .q { font-weight: 600; margin-bottom: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 8px; }
.btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.evl { margin: 6px 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.ifno { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.lockline { font-size: 12.5px; color: var(--red); margin-top: 6px; }
.offer { border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.offer p { margin: 0 0 10px; }
.dr { padding: 9px 0; border-bottom: 1px solid var(--hair); }
.dr .acts { display: flex; gap: 16px; margin-top: 4px; }
.dr .acts .tbtn { text-decoration: underline; }
/* in force */
.fi { padding: 7px 0; border-bottom: 1px solid var(--hair); }
.fl { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.stw { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.stw.s-broken { color: var(--red); }
.fi .why { margin-top: 1px; }
.fi .acts { margin-top: 3px; display: flex; gap: 14px; }
.fi .acts .tbtn { text-decoration: underline; }
.dry { margin-top: 4px; font-size: 13px; color: var(--muted); }
.wrow { padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
/* all projects */
.pr { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--hair); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.pr:first-child { border-top: 1px solid var(--hair); }
.pr:hover .pn { text-decoration: underline; }
.pn { font-weight: 600; font-size: 16px; display: block; }
.pr .cn { color: var(--muted); font-size: 13px; white-space: nowrap; }
.pr .cn.on { color: var(--accent); }
@media (max-width: 560px) { .pr { grid-template-columns: minmax(0, 1fr) auto; } .pr .st { grid-column: 1 / -1; } }
/* thread */
.now { margin: 16px 0 28px; font-size: 15px; }
.now .lab { color: var(--muted); margin-right: 10px; font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; gap: 32px; } }
.two h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.two ul { margin: 0; padding-left: 18px; }
.two li { margin-bottom: 4px; }
.tcol { max-width: 760px; }
/* drawers, prompt */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 160ms; }
.scrim.on { opacity: 1; pointer-events: auto; }
.slide { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 50; background: var(--bg); border-left: 1px solid var(--hair); box-shadow: var(--shadow); transform: translateX(105%); transition: transform 180ms ease; display: flex; flex-direction: column; }
.slide.on { transform: none; }
.slide > header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.slide > header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.slide .body { padding: 16px 18px 40px; overflow-y: auto; flex: 1; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; }
.kind-row { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.steps3 { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.step { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 2px; font-size: 13px; color: var(--muted); }
.step.on { color: var(--ink); border-bottom-color: var(--ink); }
.step[disabled] { cursor: default; }
.step:not(.on)[disabled] { opacity: 0.5; }
.blob { position: fixed; right: 20px; bottom: 20px; z-index: 30; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.prompt { position: fixed; right: 20px; bottom: 86px; z-index: 35; width: min(380px, calc(100% - 40px)); background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 14px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 160ms, transform 160ms; max-height: 560px; overflow-y: auto; }
.prompt.on { opacity: 1; transform: none; pointer-events: auto; }
.looking { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input, .dr-input { flex: 1; min-width: 0; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink); font: inherit; }
.icon-btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; }
.confirm { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
.confirm label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 6px 0; }
.bar { height: 3px; background: var(--hair); overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; width: 100%; background: var(--ink); }
.bubble { border-left: 2px solid var(--ink); padding: 2px 0 2px 10px; margin-bottom: 10px; font-size: 13.5px; }
.place { border: 1px solid var(--hair); border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13.5px; }
.place .r { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.place .lab { width: 84px; color: var(--muted); }
.opt { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 1px; font-size: 13px; color: var(--muted); }
.opt.on { color: var(--ink); border-bottom-color: var(--ink); }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100% - 110px); }
.toast { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 9px 14px; font-size: 13px; display: flex; gap: 12px; align-items: center; animation: pop 160ms ease; transition: opacity 200ms; }
.toast.out { opacity: 0; }
.toast button { background: none; border: 0; color: var(--bg); text-decoration: underline; padding: 0; }
@media (max-width: 560px) { main { padding: 22px 16px 110px; } .topbar { padding: 10px 16px; } }
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" data-act="go-all">Forge Desk</button>
  <span class="grow"></span>
  <button class="tbtn acc" id="needsBtn" data-act="open-inbox">Needs you (0)</button>
  <button class="tbtn" id="trustBtn" data-act="open-trust">Trust</button>
</header>
<main id="app"></main>
<footer>Mock. All data is made up.</footer>
<button class="blob" id="blob" data-act="toggle-prompt" aria-label="Say something">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>
</button>
<div class="prompt" id="prompt">
  <div class="looking" id="looking"></div>
  <div id="ppDyn"></div>
  <div class="inrow">
    <input id="ppInput" type="text" placeholder="Say anything. Press Enter to send." autocomplete="off">
    <button class="icon-btn" data-act="mic" aria-label="Voice, not connected in this mock">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="btn dark" data-act="send">Send</button>
  </div>
</div>
<div class="scrim" id="scrim" data-act="close-all"></div>
<aside class="slide" id="inbox" aria-label="Decision inbox">
  <header><h2>Needs you</h2><button class="x" data-act="close-all" aria-label="Close">&times;</button></header>
  <div class="body"><div class="sh" id="inboxTabs"></div><div id="inboxBody"></div></div>
</aside>
<aside class="slide" id="trust" aria-label="Trust settings">
  <header><h2>What it may do on its own</h2><button class="x" data-act="close-all" aria-label="Close">&times;</button></header>
  <div class="body" id="trustBody"></div>
</aside>
<div class="toasts" id="toasts"></div>

  function totalNeeds() { return S.cards.length + 2; }
  function screenAll() {
    var forgeN = S.cards.length, total = totalNeeds(), projs = (forgeN ? 1 : 0) + 1;
    var line = total ? "You were away 3 h 10 min. " + plural(total, "thing") + " need" + (total === 1 ? "s" : "") + " you across " + plural(projs, "project") + "." : "You were away 3 h 10 min. Nothing needs you.";
    var rows = PROJECTS.map(function (p) {
      var cnt = p.dyn ? forgeN : p.c;
      var s = p.dyn ? (cnt > 0 ? "needs" : "work") : p.s;
      var txt = p.dyn ? "The release is one decision away." : p.t;
      return '<button class="pr" data-act="project" data-look="Project: ' + esc(p.n) + '">' + dot(s) + '<span><span class="pn">' + esc(p.n) + '</span><span class="mu">' + esc(txt) + "</span></span>" +
        '<span class="cn' + (cnt ? " on" : "") + '">' + (cnt ? cnt + " need you" : "nothing needs you") + "</span></button>";
    }).join("");
    return '<div class="crumb">All projects</div><h1>All projects</h1><p class="lede serif">' + esc(line) + "</p>" + '<div style="margin-top:28px">' + rows + "</div>";
  }
  function screenProject() {
    var needs = S.cards.length > 0;
    var more = '<span class="menuwrap"><button class="tbtn" data-act="more">More</button>' + (S.more ? '<div class="pop">' +
      (S.hid.length ? S.hid.map(function (h) { return '<button data-act="unhide" data-b="' + h.id + '">' + esc(blkTitle(h.id)) + "</button>"; }).join("") : '<div class="mu">No hidden blocks</div>') + "</div>" : "") + "</span>";
    var h = '<div class="crumb"><a data-act="go-all">All projects</a> / <span>Forge</span></div>' +
      '<div class="h1row"><div class="h1l"><h1>Forge</h1>' + dot(needs ? "needs" : "work") + '</div><div class="hbtns"><button class="tbtn" data-act="edit">' + (S.edit ? "Done" : "Edit layout") + "</button>" + more + "</div></div>" +
      '<p class="lede serif">The release is one decision away. The cloud receipt fix is on its second review.</p>' +
      '<p class="meta">3 agents working · 2 waiting on you · nothing stuck · updated 4 min ago</p>';
    function col(c) { return '<div class="col">' + S.cols[c].map(secHtml).join("") + (S.edit ? addSlot(c) : "") + "</div>"; }
    return h + '<div class="cols">' + col("main") + col("side") + "</div>";
  }
  function screenThread() {
    var t = thr(S.thread), g = goal(t.goal);
    var d = { short: t.sum, story: t.paras.map(function (p) { return { k: p[0], t: p[1], claim: p[2], src: [[t.ch + " · 1 run"]] }; }), all: t.rows };
    var mine = S.log.filter(function (l) { return l.t === t.id; });
    function ul(a) { return a.length ? "<ul>" + a.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : '<p class="mu" style="margin:0">Nothing yet.</p>'; }
    return '<div class="tcol"><div class="crumb"><a data-act="go-all">All projects</a> / <a data-act="go-project">Forge</a> / <span>' + esc(t.ag) + "</span></div>" +
      '<div class="h1row"><div class="h1l"><h1>' + esc(t.ag) + "</h1>" + dot(t.s) + '</div></div><p class="mu" style="margin:6px 0 0">' + esc(g.n) + " · " + esc(t.ch) + "</p>" +
      '<p class="now" data-look="Thread: ' + esc(t.ag) + '"><span class="lab">Now</span>' + esc(t.now) + "</p>" +
      '<section class="sec" style="margin-bottom:32px;padding-top:14px;border-top:1px solid var(--hair)"><div class="sh"><h3>Brief</h3><span class="grow"></span>' + densHtml(S.tdens, "tdens") + "</div>" + briefBody(d, S.tdens, mine, false) + "</section>" +
      '<section class="sec" style="padding-top:14px;border-top:1px solid var(--hair)"><div class="sh"><h3>Claimed and proven</h3></div><div class="two"><div><h4>Claimed</h4>' + ul(t.claimed) + "</div><div><h4>Proven</h4>" + ul(t.proven) + "</div></div></section></div>";
  }
  /* ---------- panels ---------- */
  function inboxRender() {
    var d = needsParts();
    $("inboxTabs").innerHTML = tabsHtml("needs", d.tabs, d.cur);
    $("inboxBody").innerHTML = d.body;
  }
  function trustRender() {
    var order = ["branch", "review", "deps", "flaky", "publish"];
    var steps = [["ask", "Ask every time"], ["batch", "Ask once a day in a batch"], ["auto", "Do it and show me, with undo"]];
    $("trustBody").innerHTML = '<p class="mu sm" style="margin-top:0">Trust is earned one kind of decision at a time. You are always in control.</p>' + order.map(function (k) {
      var locked = KINDS[k].irr;
      return '<div class="kind-row"><b>' + esc(KINDS[k].name) + "</b>" + (locked ? '<div class="mu sm">Always asks. Cannot be made automatic.</div>' : "") +
        '<div class="steps3">' + steps.map(function (s) {
          return '<button class="step' + (S.level[k] === s[0] ? " on" : "") + '" data-act="level" data-k="' + k + '" data-l="' + s[0] + '"' + (locked ? " disabled" : "") + ">" + s[1] + "</button>";
        }).join("") + "</div></div>";
    }).join("");
  }
  function lookText() {
    if (S.look) return S.look;
    return S.screen === "all" ? "All projects" : S.screen === "project" ? "Project Forge" : "Thread " + thr(S.thread).ag;
  }
  function render() {
    var n = S.cards.length;
    $("needsBtn").textContent = "Needs you (" + n + ")";
    $("trustBtn").textContent = "Trust · " + autoKinds().length + " automatic";
    $("app").innerHTML = S.screen === "all" ? screenAll() : S.screen === "project" ? screenProject() : screenThread();
    inboxRender();
    trustRender();
    $("looking").textContent = "Looking at: " + lookText() + " · To: " + tName();
  }
  function openPanel(which) {
    closeAll();
    S.panel = which;
    $(which).classList.add("on");
    $("scrim").classList.add("on");
  }
  function closeAll() {
    ["inbox", "trust"].forEach(function (id) { $(id).classList.remove("on"); });
    $("scrim").classList.remove("on");
    S.panel = null;
  }
  function go(screen, opts) {
    S.screen = screen;
    S.look = null;
    S.more = false;
    if (opts && opts.thread) { S.thread = opts.thread; if (!thr(opts.thread).tab || thr(opts.thread).tab !== "fin") S.tid = opts.thread; }
    closeAll();
    render();
    window.scrollTo(0, 0);
  }
  /* ---------- layout ---------- */
  function move(id, dir) {
    var a = S.cols[colOf(id)], i = a.indexOf(id), j = i + dir;
    if (j < 0 || j >= a.length) return;
    a.splice(i, 1);
    a.splice(j, 0, id);
    render();
  }
  function hideBlock(id) {
    var c = colOf(id);
    S.cols[c].splice(S.cols[c].indexOf(id), 1);
    S.hid.push({ id: id, col: c });
    render();
    toast(blkTitle(id) + " moved to More.");
  }
  function unhide(id) {
    var h = S.hid.filter(function (x) { return x.id === id; })[0];
    if (!h) return;
    S.hid.splice(S.hid.indexOf(h), 1);
    S.cols[h.col].push(id);
    S.more = false;
    render();
    toast(blkTitle(id) + " is back.");
  }
  function addBlock(col, name) {
    S.cols[col].push("x_" + name);
    S.added[name] = true;
    render();
    toast("Added " + name + ".");
  }
  /* ---------- prompt ---------- */
  function ppRender() {
    var h = "";
    if (S.pend) {
      h += '<div class="confirm">To: <b>' + esc(tName()) + '</b> · <button class="tbtn" style="text-decoration:underline" data-act="change-target">Change</button>' +
        '<div class="mu" style="margin-top:4px">' + esc(S.pend.text) + "</div>" +
        '<label><input type="checkbox" id="skipBox"' + (S.pend.skipTick ? " checked" : "") + "> Do not show this next time for this kind</label>" +
        '<div class="bar"><i id="barFill"></i></div><button class="btn" data-act="undo-send">Undo</button> <span class="mu sm" id="secs"></span></div>';
    }
    if (S.answer) h += '<div class="bubble"><b>' + esc(S.answer.q) + "</b><br>" + esc(S.answer.a) + '<br><span class="mu sm">Answered from the log, no agent started</span></div>';
    if (S.pl) h += placeHtml();
    $("ppDyn").innerHTML = h;
  }
  function placeHtml() {
    var p = S.pl;
    function chips(arr, cur, act) { return arr.map(function (x) { return '<button class="opt' + (x === cur ? " on" : "") + '" data-act="' + act + '" data-v="' + x + '">' + x + "</button>"; }).join(""); }
    return '<div class="place"><div><b>You said:</b> ' + esc(p.text) + "</div>" +
      '<div class="r"><span class="lab">Kind</span>' + chips(["Note", "Rule", "Law"], p.kind, "pl-kind") + "</div>" +
      '<div class="r"><span class="lab">Applies to</span>' + chips(["This thread", "This project", "All projects"], p.scope, "pl-scope") + "</div>" +
      '<div class="r"><span class="lab">Enforced by</span><span>nothing yet</span> <a data-act="pl-enforce">Make it enforced</a></div>' +
      (p.fast ? '<div class="r">This replaces an older note. <button class="opt' + (p.replace ? " on" : "") + '" data-act="pl-replace">' + (p.replace ? "Will replace" : "Replace it") + "</button></div>" : "") +
      '<div class="r"><button class="btn dark" data-act="pl-accept">Accept</button><button class="tbtn" data-act="pl-cancel">Cancel</button></div></div>';
  }
  function addLog(text, tid) { var e = { t: tid, text: text, time: "now" }; S.log.unshift(e); return e; }
  function sendPrompt(forced) {
    var inp = $("ppInput");
    var txt = (forced || inp.value).trim();
    if (!txt) return;
    if (S.pend) commitSend();
    S.answer = null; S.pl = null;
    var low = txt.toLowerCase();
    inp.value = "";
    if (low.indexOf("always") >= 0 || low.indexOf("never") >= 0) {
      S.pl = { text: txt, kind: "Rule", scope: "This project", fast: low.indexOf("fast mode") >= 0, replace: false };
      ppRender();
      return;
    }
    if (/\?\s*$/.test(txt)) {
      S.answer = { q: txt, a: "The last green run was 2 hours ago, on change 44." };
      ppRender();
      return;
    }
    if (S.skip.steer) {
      var e = addLog(txt, S.tid);
      render();
      toast("Sent", function () { S.log.splice(S.log.indexOf(e), 1); render(); });
      return;
    }
    S.pend = { text: txt, start: Date.now(), skipTick: false };
    ppRender();
    S.pend.timer = setInterval(tick, 100);
  }
  function tick() {
    if (!S.pend) return;
    var left = Math.max(0, 10 - (Date.now() - S.pend.start) / 1000);
    var f = $("barFill"), s = $("secs");
    if (f) f.style.width = (left * 10) + "%";
    if (s) s.textContent = Math.ceil(left) + "s";
    if (left <= 0) commitSend();
  }
  function commitSend() {
    var p = S.pend;
    if (!p) return;
    clearInterval(p.timer);
    var box = $("skipBox");
    if (box && box.checked) S.skip.steer = true;
    S.pend = null;
    addLog(p.text, S.tid);
    ppRender();
    render();
    toast("Sent");
  }
  function undoSend() {
    if (!S.pend) return;
    clearInterval(S.pend.timer);
    $("ppInput").value = S.pend.text;
    S.pend = null;
    ppRender();
    toast("Not sent. Your text is back in the box.");
  }
  function openPrompt() {
    $("prompt").classList.add("on");
    $("looking").textContent = "Looking at: " + lookText() + " · To: " + tName();
    setTimeout(function () { $("ppInput").focus(); }, 180);
  }
  function acceptPlacement() {
    var p = S.pl;
    if (!p) return;
    var key = { Note: "notes", Rule: "rules", Law: "laws" }[p.kind];
    if (p.fast && p.replace) S.lists.notes = S.lists.notes.filter(function (r) { return r.t !== "Never use fast mode"; });
    S.lists[key].unshift({ t: p.text, s: "not" });
    S.tab.force = key;
    S.pl = null;
    ppRender();
    render();
    toast("Added to In force as not enforced.");
  }
  function promote() {
    if (S.researchDone) return;
    S.researchDone = true;
    S.cards.push({ id: "c7", kind: "research", short: "CI parallel run", q: "Run the two CI jobs side by side?", opts: ["Try it for a day", "Not now"], def: 1,
      ev: ["Research says the saving is about 4 minutes.", "The two jobs share one cache and may clash."] });
    render();
    toast("Promoted. It is now a question in Needs you.");
  }
  /* ---------- click routing ---------- */
  document.addEventListener("click", function (ev) {
    var look = ev.target.closest("[data-look]");
    if (look && !ev.target.closest(".prompt") && !ev.target.closest(".slide")) {
      S.look = look.getAttribute("data-look");
      $("looking").textContent = "Looking at: " + S.look + " · To: " + tName();
    }
    if (S.more && !ev.target.closest(".menuwrap")) { S.more = false; render(); }
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var a = el.getAttribute("data-act");
    var d = function (k) { return el.getAttribute("data-" + k); };
    switch (a) {
      case "go-all": go("all"); break;
      case "go-project": go("project"); break;
      case "project": go("project"); break;
      case "thread": go("thread", { thread: d("id") }); break;
      case "open-inbox": S.tab.needs = "needs"; render(); openPanel("inbox"); break;
      case "open-trust": render(); openPanel("trust"); break;
      case "close-all": closeAll(); break;
      case "stab": S.tab[d("s") === "research" ? "res" : d("s")] = d("t"); render(); break;
      case "dens": S.dens = d("v"); render(); break;
      case "tdens": S.tdens = d("v"); render(); break;
      case "edit": S.edit = !S.edit; S.more = false; render(); break;
      case "more": S.more = !S.more; render(); break;
      case "unhide": unhide(d("b")); break;
      case "up": move(d("b"), -1); break;
      case "down": move(d("b"), 1); break;
      case "hide": hideBlock(d("b")); break;
      case "add": addBlock(d("c"), d("n")); break;
      case "res-open": S.resOpen = true; render(); break;
      case "res-close": S.resOpen = false; render(); break;
      case "ans": answer(d("id"), parseInt(d("i"), 10)); break;
      case "ev": S.evOpen[d("id")] = !S.evOpen[d("id")]; render(); break;
      case "all-defaults": takeAllDefaults(); break;
      case "offer-yes": makeAuto(S.offer); break;
      case "offer-no": S.offerNo[S.offer] = true; S.offer = null; render(); toast("Okay. It will keep asking."); break;
      case "undo-done": undoDone(parseInt(d("i"), 10)); break;
      case "ask-again": askAgain(parseInt(d("i"), 10)); break;
      case "level": setLevel(d("k"), d("l")); break;
      case "enforce": S.lists[d("l")][parseInt(d("i"), 10)].s = "enforced"; render(); toast("Done. That note is now enforced."); break;
      case "dry": S.dry = !S.dry; render(); break;
      case "promote": promote(); break;
      case "nudge": S.tid = d("id"); S.look = "Thread: " + thr(d("id")).ag; openPrompt(); break;
      case "toggle-prompt": if ($("prompt").classList.contains("on")) $("prompt").classList.remove("on"); else openPrompt(); break;
      case "send": sendPrompt(); break;
      case "mic": toast("Voice is not connected in this mock."); break;
      case "change-target":
        var ids = THREADS.filter(function (t) { return t.tab !== "fin"; }).map(function (t) { return t.id; });
        S.tid = ids[(ids.indexOf(S.tid) + 1) % ids.length];
        ppRender(); render(); if (S.pend) tick(); break;
      case "undo-send": undoSend(); break;
      case "pl-kind": S.pl.kind = d("v"); ppRender(); break;
      case "pl-scope": S.pl.scope = d("v"); ppRender(); break;
      case "pl-enforce": toast("Enforcing needs a check that can run. None exists for this yet."); break;
      case "pl-replace": S.pl.replace = !S.pl.replace; ppRender(); break;
      case "pl-accept": acceptPlacement(); break;
      case "pl-cancel": S.pl = null; ppRender(); break;
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "ppInput") sendPrompt();
    if (ev.key === "Escape") { closeAll(); $("prompt").classList.remove("on"); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "skipBox" && S.pend) S.pend.skipTick = ev.target.checked;
  });
  render();
})();
</script>
</body>
</html>
